<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram | Public Architecture Mirror</title>

    <!-- Typography Subsystems -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #000000;
            --bg-gcp: #1a1c1e; /* GCP Styled Dark Contrast Surface */
            --gcp-blue: #8ab4f8; /* Enterprise Admin Accents */
            --text-main: #f1f3f4;
            --text-muted: #9aa0a6;
            --accent-red: #ff3040; /* Instagram Crimson Like Indicator */
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --glass-sheet: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --ios-blur: blur(30px) saturate(200%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            background-color: var(--bg-base); color: var(--text-main);
            font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 95px;
        }

        /* Fluid Glass Layout Definition */
        .liquid-glass {
            background: var(--glass-sheet); backdrop-filter: var(--ios-blur); -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--glass-border); border-radius: 16px;
        }

        /* -----------------------------------------
           ENTERPRISE GOOGLE CLOUD AUTHENTICATION FRAME
        -------------------------------------------- */
        #gcp-cloud-auth-view {
            position: fixed; inset: 0; z-index: 99999; background: #000000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .gcp-auth-card {
            width: 100%; max-width: 450px; background: var(--bg-gcp); border: 1px solid #3c4043;
            border-radius: 8px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .gcp-logo-emulation {
            display: flex; gap: 4px; justify-content: center; margin-bottom: 24px; font-weight: 600; font-size: 18px; letter-spacing: -0.5px;
        }
        .gcp-logo-emulation span:nth-child(1) { color: #4285f4; }
        .gcp-logo-emulation span:nth-child(2) { color: #ea4335; }
        .gcp-logo-emulation span:nth-child(3) { color: #fbbc05; }
        .gcp-logo-emulation span:nth-child(4) { color: #34a853; }
        
        .gcp-auth-card h2 { font-size: 24px; font-weight: 400; margin-bottom: 10px; text-align: center; }
        .gcp-auth-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; text-align: center; }

        .gcp-tab-group { display: flex; border-bottom: 1px solid #3c4043; margin-bottom: 24px; }
        .gcp-tab-btn { flex: 1; background: transparent; border: none; padding: 12px; color: var(--text-muted); font-size: 14px; cursor: pointer; text-align: center; }
        .gcp-tab-btn.active-gcp-tab { color: var(--gcp-blue); border-bottom: 2px solid var(--gcp-blue); font-weight: 500; }

        /* Minimal Modern Input Boxes */
        .gcp-input-wrapper { position: relative; margin-bottom: 20px; }
        .gcp-input-field {
            width: 100%; background: transparent; border: 1px solid #5f6368; border-radius: 4px;
            padding: 14px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .gcp-input-field:focus { border-color: var(--gcp-blue); }
        
        .gcp-submit-btn {
            width: 100%; background: #4285f4; color: #fff; border: none; padding: 12px;
            border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .gcp-submit-btn:hover { background: #3b78e7; }

        /* -----------------------------------------
           INSTAGRAM LAYOUT ARCHITECTURE CORES
        -------------------------------------------- */
        .instagram-header-dock {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px; z-index: 9000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            background: rgba(0,0,0,0.5); backdrop-filter: var(--ios-blur); -webkit-backdrop-filter: var(--ios-blur);
            border-bottom: 1px solid var(--glass-border);
        }
        .brand-signature { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; cursor: pointer; }
        .brand-signature span { color: var(--gcp-blue); }
        .header-actions { display: flex; align-items: center; gap: 16px; position: relative; }
        
        .icon-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .notification-badge-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: var(--accent-red); border-radius: 50%; display: none; }

        .container { max-width: 600px; margin: 0 auto; padding: 84px 12px 40px 12px; }

        /* Instagram Horizontal Stories Component */
        .stories-carousel-tray {
            width: 100%; display: flex; gap: 16px; overflow-x: auto; padding: 14px 4px; margin-bottom: 24px;
        }
        .stories-carousel-tray::-webkit-scrollbar { display: none; }
        .story-avatar-node { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
        .story-ring { width: 62px; height: 62px; border-radius: 50%; padding: 2.5px; background: var(--insta-gradient); }
        .story-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid #000; }
        .story-username-string { font-size: 11px; color: var(--text-muted); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Instagram Feed Post Layouts */
        .instagram-post-card { width: 100%; margin-bottom: 24px; overflow: hidden; border: 1px solid var(--glass-border); border-radius: 12px; background: #000; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
        .post-user-meta { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .post-avatar-mini { width: 32px; height: 32px; border-radius: 50%; padding: 1.5px; background: var(--insta-gradient); }
        .post-avatar-mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 1.5px solid #000; }
        .post-username { font-size: 13px; font-weight: 600; }
        .post-delete-trigger { background: transparent; border: none; color: rgba(255,48,64,0.7); font-size: 12px; cursor: pointer; }

        .post-viewport { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #05070a; display: flex; align-items: center; justify-content: center; }
        .post-viewport img { width: 100%; height: 100%; object-fit: cover; }

        .post-buttons-strip { padding: 12px 14px 4px 14px; display: flex; gap: 14px; }
        .post-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; transition: transform 0.1s; }
        .post-btn:hover { transform: scale(1.05); }
        .post-btn.liked { color: var(--accent-red); }

        .post-metrics-row { padding: 0 14px; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .post-caption-row { padding: 0 14px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
        .post-caption-row strong { margin-right: 6px; }

        /* Comments List Mechanics */
        .post-comments-area { padding: 10px 14px 14px 14px; border-top: 1px solid rgba(255,255,255,0.05); }
        .comments-scroll-tray { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .comments-scroll-tray::-webkit-scrollbar { width: 2px; }
        .comments-scroll-tray::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
        .comment-node { font-size: 12px; line-height: 1.4; }
        .comment-node strong { margin-right: 6px; color: var(--gcp-blue); }
        
        .comment-form { display: flex; gap: 8px; margin-top: 10px; }
        .comment-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }

        /* -----------------------------------------
           NOTIFICATIONS DRAWER OVERLAY PANEL
        -------------------------------------------- */
        #global-notifications-panel {
            position: absolute; top: 60px; right: 20px; width: 330px; max-height: 400px;
            z-index: 9995; display: none; flex-direction: column; padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); background: #0b0e14;
        }
        .noti-panel-header { font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .noti-list-wrapper { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .noti-item-row { display: flex; align-items: center; gap: 10px; font-size: 12px; line-height: 1.4; }
        .noti-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

        /* -----------------------------------------
           INSTAGRAM PROFILE VIEW COMPONENT GRID
        -------------------------------------------- */
        .profile-wrapper { max-width: 730px; margin: 0 auto; padding: 84px 12px 40px 12px; display: none; }
        .profile-info-header { padding: 24px; display: flex; gap: 32px; align-items: center; margin-bottom: 24px; }
        .profile-avatar-main { width: 84px; height: 84px; border-radius: 50%; padding: 2.5px; background: var(--insta-gradient); flex-shrink: 0; }
        .profile-avatar-main img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid #000; }
        
        .profile-meta-block { flex: 1; }
        .profile-user-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
        .profile-handle { font-size: 18px; font-weight: 400; }
        .profile-stats-row { display: flex; gap: 20px; margin-bottom: 10px; font-size: 13px; color: var(--text-muted); }
        .profile-stats-row strong { color: #fff; }
        .profile-bio-summary h1 { font-size: 13px; font-weight: 600; }
        .profile-bio-summary p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        /* 3-Column Image Layout Matrix Grid */
        .insta-3col-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .grid-cell-item { position: relative; aspect-ratio: 1/1; background: #111; overflow: hidden; cursor: pointer; }
        .grid-cell-item img { width: 100%; height: 100%; object-fit: cover; }
        .grid-cell-hover-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; gap: 12px; font-size: 13px; font-weight: 600; }
        .grid-cell-item:hover .grid-cell-hover-overlay { opacity: 1; }

        /* -----------------------------------------
           DECOUPLED IMAGE UPLOAD SCREEN MODAL BOX
        -------------------------------------------- */
        #global-upload-modal {
            position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .upload-modal-content { width: 100%; max-width: 420px; padding: 24px; position: relative; }
        .modal-close-btn { position: absolute; top: 14px; right: 16px; background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .upload-modal-content h3 { font-size: 16px; text-align: center; margin-bottom: 16px; font-weight: 500; }
        
        /* Clean Decoupled Selector Field Layout */
        .upload-file-selector-box {
            border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px; padding: 24px 12px;
            text-align: center; cursor: pointer; margin-bottom: 16px; background: rgba(255,255,255,0.01);
        }
        .upload-file-selector-box:hover { background: rgba(255,255,255,0.03); }
        .upload-file-selector-box p { font-size: 12px; color: var(--text-muted); }
        
        /* Pre-flight Upload Rendering Container */
        #preflightImageFramePreview {
            width: 100%; max-height: 160px; object-fit: contain; border-radius: 6px; display: none; margin-bottom: 16px; background: #000; padding: 4px;
        }

        /* Fixed Navigation Footer Tray */
        .ios-action-footer-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; height: 56px; z-index: 9000;
            display: flex; align-items: center; justify-content: space-around;
        }
        .dock-node-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .dock-node-btn:hover { background: rgba(255,255,255,0.08); }

        #scrollTrackerBar { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--gcp-blue); width: 0%; z-index: 99999; }
    </style>
</head>
<body>

    <div id="scrollTrackerBar"></div>

    <!-- AUTH MODULE: enterprise google cloud card layout view -->
    <section id="gcp-cloud-auth-view">
        <div class="gcp-auth-card">
            <div class="gcp-logo-emulation"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
            <h2 id="gcpHeadline">Sign in</h2>
            <p id="gcpSubtitle">to continue to Dillu Captures Platform Services</p>
            
            <div class="gcp-tab-group">
                <button id="gcpTabLogin" class="gcp-tab-btn active-gcp-tab" onclick="toggleGcpAuthContext('login')">Sign In</button>
                <button id="gcpTabRegister" class="gcp-tab-btn" onclick="toggleGcpAuthContext('register')">Create Account</button>
            </div>

            <form id="gcpInputSubmissionPipeline" onsubmit="processAuthVerificationRequest(event)">
                <div id="gcpExtraFormGroup" style="display: none;">
                    <div class="gcp-input-wrapper">
                        <input type="text" id="gcpInputFullName" class="gcp-input-field" placeholder="Full Name">
                    </div>
                    <div class="gcp-input-wrapper">
                        <input type="text" id="gcpInputBio" class="gcp-input-field" placeholder="Profile Bio Details">
                    </div>
                </div>
                
                <div class="gcp-input-wrapper">
                    <input type="text" id="gcpInputUsername" class="gcp-input-field" placeholder="Username / Email Handle" required autocomplete="off">
                </div>
                <div class="gcp-input-wrapper">
                    <input type="password" id="gcpInputPassword" class="gcp-input-field" placeholder="Enter password configuration" required>
                </div>

                <button type="submit" class="gcp-submit-btn">Next</button>
            </form>
        </div>
    </section>

    <!-- MAIN CORE RUNTIME LAYOUT -->
    <div id="runtimeApplicationView" style="display: none;">
        
        <!-- Header Element Structure -->
        <header class="instagram-header-dock">
            <div class="brand-signature" onclick="switchActiveViewTab('feed')">Instagram_<span>Engine</span></div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleNotificationsPanelDropdown()" title="Notifications Track">
                    ❤️<div class="notification-badge-dot" id="notiTrackerDot"></div>
                </button>
                <button class="icon-btn" onclick="executeSignoutPipeline()" style="font-size:15px;" title="Secure Exit">🔒</button>
                
                <!-- Instant Notifications Dropdown Container Block -->
                <div class="liquid-glass" id="global-notifications-panel">
                    <div class="noti-panel-header">Recent Activity Notifications</div>
                    <div class="noti-list-wrapper" id="notificationsInjectedTarget"></div>
                </div>
            </div>
        </header>

        <!-- ROUTER SUBVIEW WINDOWS -->

        <!-- CONTAINER 1: CENTRAL TIMELINE STREAM FEED -->
        <main class="container app-view-panel" id="view-feed-panel">
            <!-- Instagram Stories Carousel Tray Component -->
            <div class="stories-carousel-tray">
                <div class="story-avatar-node" onclick="switchActiveViewTab('profile', 'dillu_captures')">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-119741497674-611481863552?auto=format&fit=crop&w=150&q=80" alt=""></div>
                    <span class="story-username-string">Your Story</span>
                </div>
                <div class="story-avatar-node" onclick="switchActiveViewTab('profile', 'creative_lens')">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1183939003579-730e3918a45a?auto=format&fit=crop&w=150&q=80" alt=""></div>
                    <span class="story-username-string">creative_lens</span>
                </div>
                <div class="story-avatar-node">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt=""></div>
                    <span class="story-username-string">vogue_fashion</span>
                </div>
                <div class="story-avatar-node">
                    <div class="story-ring"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" alt=""></div>
                    <span class="story-username-string">lux_studios</span>
                </div>
            </div>

            <!-- Injectable Feed Timeline Element Wrapper Box -->
            <div id="timelineFeedsInjectedTarget"></div>
        </main>

        <!-- CONTAINER 2: 3-COLUMN USER ARCHIVE PROFILE VIEW -->
        <section class="profile-wrapper app-view-panel" id="view-profile-panel">
            <div id="userProfileInjectedTarget"></div>
        </section>

        <!-- FIXED CONTROL TRAY DOCK FOOTER BAR -->
        <nav class="ios-action-footer-dock liquid-glass">
            <button class="dock-node-btn" onclick="switchActiveViewTab('feed')" title="Feed Layout Base">🏠</button>
            <button class="dock-node-btn" onclick="toggleMediaModalDisplayState(true)" title="Add Frame">➕</button>
            <button class="dock-node-btn" onclick="switchActiveViewTab('profile', '')" title="My Master Profile">👤</button>
        </nav>

        <!-- FILE DECOUPLED CREATION PIPELINE MODAL WINDOW -->
        <div id="global-upload-modal" onclick="if(event.target === this) toggleMediaModalDisplayState(false)">
            <div class="upload-modal-content liquid-glass">
                <button class="modal-close-btn" onclick="toggleMediaModalDisplayState(false)">×</button>
                <h3>Create New Timeline Post</h3>
                
                <!-- Decoupled Picker Controller Interface Element Box -->
                <div class="upload-file-selector-box" id="decoupledFilePickerClickZone">
                    <p id="pickerPromptLabel">Click inside grid frame bounds to pick photo capture...</p>
                </div>
                <!-- Independent Input Object Node Layer -->
                <input type="file" id="isolatedSystemFileChannelInput" accept="image/*" style="display: none;">

                <!-- Visual Source Confirmation Pre-flight Display Target Grid -->
                <img id="preflightImageFramePreview" src="#" alt="Pre-flight validation rendering placeholder">

                <input type="text" id="captionInputStringField" class="gcp-input-field" placeholder="Write standard Instagram caption..." autocomplete="off">
                <button class="gcp-submit-btn" style="border-radius:6px;" onclick="commitDataStringToLiveTimelineDataset()">Publish To Public Feed</button>
            </div>
        </div>

    </div>

    <!-- Lenis Frame Script Optimization Component -->
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script>
        /* System Block 1: Custom Scroll Physics Monitoring Pipeline Setup */
        const lenis = new Lenis({ duration: 1.1, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -11 * t)), smoothWheel: true });
        function renderingFrameLoopStep(timestamp) {
            lenis.raf(timestamp);
            const scrollPercentageRatio = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            const scrollBarTrackNode = document.getElementById('scrollTrackerBar');
            if(scrollBarTrackNode) scrollBarTrackNode.style.width = scrollPercentageRatio + '%';
            requestAnimationFrame(renderingFrameLoopStep);
        }
        requestAnimationFrame(renderingFrameLoopStep);

        /* System Block 2: Seed System Datasets Memory Allocations */
        const fallbackSystemUsers = [
            { username: "dillu_captures", password: "123", name: "Dillu Captures Official", bio: "Editorial luxury lifestyle photographer based in India. Capturing fine-art heirloom frames.", avatar: "https://images.unsplash.com/photo-119741497674-611481863552?auto=format&fit=crop&w=300&q=80" },
            { username: "creative_lens", password: "123", name: "Alex Mercer Studio", bio: "Visualizing spatial geometry matrices. continuous clean natural light.", avatar: "https://images.unsplash.com/photo-1183939003579-730e3918a45a?auto=format&fit=crop&w=300&q=80" }
        ];

        const fallbackSystemPosts = [
            { id: "post-seed-1", owner: "dillu_captures", imageUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80", caption: "Luxury ceremonial architectural geometry configurations.", likes: ["creative_lens"], comments: [{ author: "creative_lens", line: "Flawless lighting configuration profile balance!" }] },
            { id: "post-seed-2", owner: "creative_lens", imageUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80", caption: "Tracking natural highlights parameters across continuous frames.", likes: [], comments: [] }
        ];

        const fallbackSystemNotifications = [
            { id: "noti-1", type: "system", message: "@creative_lens liked your custom legacy showcase post seed item instance.", avatar: "https://images.unsplash.com/photo-1183939003579-730e3918a45a?auto=format&fit=crop&w=100&q=80" },
            { id: "noti-2", type: "system", message: "Welcome to Instagram-Engine Client Services dashboard interface.", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" }
        ];

        let runtimeUsersArray = [];
        let runtimePostsArray = [];
        let runtimeNotificationsArray = [];
        let sessionUserObjectHandle = null;
        let activeGcpAuthViewContext = "login";
        let localBinaryBase64StringPayload = "";
        let trackedTargetProfileContextHandle = "";

        /* System Block 3: Local Storage Synchronizer Operations Pipeline */
        function loadSystemCacheMemoryOnBootstrap() {
            if(!localStorage.getItem('RTIM_USERS_REGISTRY_v4')) {
                localStorage.setItem('RTIM_USERS_REGISTRY_v4', JSON.stringify(fallbackSystemUsers));
                localStorage.setItem('RTIM_POSTS_REGISTRY_v4', JSON.stringify(fallbackSystemPosts));
                localStorage.setItem('RTIM_NOTIFICATIONS_REGISTRY_v4', JSON.stringify(fallbackSystemNotifications));
            }
            runtimeUsersArray = JSON.parse(localStorage.getItem('RTIM_USERS_REGISTRY_v4'));
            runtimePostsArray = JSON.parse(localStorage.getItem('RTIM_POSTS_REGISTRY_v4'));
            runtimeNotificationsArray = JSON.parse(localStorage.getItem('RTIM_NOTIFICATIONS_REGISTRY_v4'));

            const trackingToken = localStorage.getItem('RTIM_ACTIVE_SESSION_TOKEN');
            if(trackingToken) {
                sessionUserObjectHandle = runtimeUsersArray.find(u => u.username === trackingToken) || null;
                bypassAuthInterfaceGateway();
            }
            evaluateNotificationBadgeDotAlertState();
        }

        function commitUpdatesToSystemStorageDevices() {
            localStorage.setItem('RTIM_USERS_REGISTRY_v4', JSON.stringify(runtimeUsersArray));
            localStorage.setItem('RTIM_POSTS_REGISTRY_v4', JSON.stringify(runtimePostsArray));
            localStorage.setItem('RTIM_NOTIFICATIONS_REGISTRY_v4', JSON.stringify(runtimeNotificationsArray));
            evaluateNotificationBadgeDotAlertState();
        }

        /* System Block 4: Google Cloud Console Inspired Authentication Engines */
        function toggleGcpAuthContext(targetCtxString) {
            activeGcpAuthViewContext = targetCtxString;
            document.getElementById('gcpTabLogin').classList.remove('active-gcp-tab');
            document.getElementById('gcpTabRegister').classList.remove('active-gcp-tab');
            const extendedFieldsBox = document.getElementById('gcpExtraFormGroup');

            if(targetCtxString === 'login') {
                document.getElementById('gcpTabLogin').add('active-gcp-tab'); // ClassList standard toggle
                document.getElementById('gcpHeadline').innerText = "Sign in";
                document.getElementById('gcpSubtitle').innerText = "to continue to Dillu Captures Platform Services";
                extendedFieldsBox.style.display = "none";
            } else {
                document.getElementById('gcpTabRegister').classList.add('active-gcp-tab');
                document.getElementById('gcpHeadline').innerText = "Create Cloud Profile";
                document.getElementById('gcpSubtitle').innerText = "Establish a brand new public metadata social account network instance";
                extendedFieldsBox.style.display = "block";
            }
        }

        function processAuthVerificationRequest(eventObj) {
            eventObj.preventDefault();
            const usernameInput = document.getElementById('gcpInputUsername').value.trim().toLowerCase();
            const passwordInput = document.getElementById('gcpInputPassword').value;

            if(activeGcpAuthViewContext === 'login') {
                const userInstanceMatch = runtimeUsersArray.find(u => u.username === usernameInput && u.password === passwordInput);
                if(userInstanceMatch) {
                    sessionUserObjectHandle = userInstanceMatch;
                    localStorage.setItem('RTIM_ACTIVE_SESSION_TOKEN', userInstanceMatch.username);
                    bypassAuthInterfaceGateway();
                } else {
                    alert("GCP Security Engine Rejection: Specified profile name or password pattern configuration matches no local entities.");
                }
            } else {
                // Handle Registration Requests Internally
                const fullNameInput = document.getElementById('gcpInputFullName').value.trim() || "Public Contributor Account";
                const bioInput = document.getElementById('gcpInputBio').value.trim() || "Photography enthusiast timeline index profile panel.";

                if(runtimeUsersArray.some(u => u.username === usernameInput)) {
                    alert("Registration Refused: Requested user target entity handle pattern already claims active residency parameters.");
                    return;
                }

                const brandNewUserNodeInstance = {
                    username: usernameInput,
                    password: passwordInput,
                    name: fullNameInput,
                    bio: bioInput,
                    avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80"
                };

                runtimeUsersArray.push(brandNewUserNodeInstance);
                sessionUserObjectHandle = brandNewUserNodeInstance;
                localStorage.setItem('RTIM_ACTIVE_SESSION_TOKEN', brandNewUserNodeInstance.username);
                commitUpdatesToSystemStorageDevices();
                bypassAuthInterfaceGateway();
            }
        }

        function bypassAuthInterfaceGateway() {
            document.getElementById('gcp-cloud-auth-view').style.display = "none";
            document.getElementById('runtimeApplicationView').style.display = "block";
            switchActiveViewTab('feed');
        }

        function executeSignoutPipeline() {
            localStorage.removeItem('RTIM_ACTIVE_SESSION_TOKEN');
            location.reload();
        }

        /* System Block 5: Multi-View Section Active State Switch Controllers */
        function switchActiveViewTab(targetTabSelectorCode, targetPayloadContextString = null) {
            document.querySelectorAll('.app-view-panel').forEach(view => view.style.display = "none");
            document.getElementById('global-notifications-panel').style.display = "none";

            if(targetTabSelectorCode === 'feed') {
                document.getElementById('view-feed-panel').style.display = "block";
                renderTimelinePostsStreamDOM();
            } else if(targetTabSelectorCode === 'profile') {
                trackedTargetProfileContextHandle = (targetPayloadContextString !== null && targetPayloadContextString !== "") ? targetPayloadContextString : (sessionUserObjectHandle ? sessionUserObjectHandle.username : "dillu_captures");
                document.getElementById('view-profile-panel').style.display = "block";
                renderUserProfileAnalyticsGridDOM();
            }
            lenis.scrollTo(0, { immediate: true });
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 60);
        }

        /* System Block 6: Instagram Central Post Stream Generators */
        function renderTimelinePostsStreamDOM() {
            const feedContainer = document.getElementById('timelineFeedsInjectedTarget');
            if(!feedContainer) return;
            feedContainer.innerHTML = "";

            if(runtimePostsArray.length === 0) {
                feedContainer.innerHTML = `<div class="liquid-glass" style="padding:40px; text-align:center; color:var(--text-muted); font-size:12px;">No photography published to public databases yet. Click "+" to create one.</div>`;
                return;
            }

            runtimePostsArray.forEach(post => {
                const ownerProfile = runtimeUsersArray.find(u => u.username === post.owner) || { name: "Public User", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" };
                const userLikedThisPost = sessionUserObjectHandle && post.likes.includes(sessionUserObjectHandle.username);
                const isItemDeletable = sessionUserObjectHandle && (sessionUserObjectHandle.username === post.owner || sessionUserObjectHandle.username === "dillu_captures");

                let compiledCommentsHTML = "";
                post.comments.forEach(comment => {
                    compiledCommentsHTML += `<div class="comment-node"><strong>@${comment.author}</strong>${comment.line}</div>`;
                });

                const postOuterArticleCard = document.createElement('article');
                postOuterArticleCard.className = "instagram-post-card";
                postOuterArticleCard.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-meta" onclick="switchActiveViewTab('profile', '${post.owner}')">
                            <div class="post-avatar-mini"><img src="${ownerProfile.avatar}" alt=""></div>
                            <span class="post-username">${post.owner}</span>
                        </div>
                        ${isItemDeletable ? `<button class="post-delete-trigger" onclick="executeTargetPostDestruction('${post.id}')">Delete</button>` : ''}
                    </div>

                    <div class="post-viewport" ondblclick="togglePostLikingInteraction('${post.id}')">
                        <img src="${post.imageUrl}" alt="Instagram Media Asset" loading="lazy">
                    </div>

                    <div class="post-buttons-strip">
                        <button class="post-btn ${userLikedThisPost ? 'liked' : ''}" onclick="togglePostLikingInteraction('${post.id}')">
                            ${userLikedThisPost ? '❤️' : '🤍'}
                        </button>
                        <button class="post-btn" onclick="document.getElementById('input-comm-${post.id}').focus()">💬</button>
                    </div>

                    <div class="post-metrics-row">${post.likes.length} likes</div>
                    <div class="post-caption-row"><strong>${post.owner}</strong>${post.caption}</div>

                    <div class="post-comments-area">
                        <div class="comments-scroll-tray">${compiledCommentsHTML}</div>
                        <form class="comment-form" onsubmit="appendNewCommentTextStringLine(event, '${post.id}')">
                            <input type="text" id="input-comm-${post.id}" class="comment-input" placeholder="Add custom comment note details..." required autocomplete="off">
                        </form>
                    </div>
                `;
                feedContainer.appendChild(postOuterArticleCard);
            });
        }

        /* System Block 7: Instagram Analytical Profile Display Systems Grid */
        function renderUserProfileAnalyticsGridDOM() {
            const container = document.getElementById('userProfileInjectedTarget');
            if(!container) return;
            container.innerHTML = "";

            const targetUser = runtimeUsersArray.find(u => u.username === trackedTargetProfileContextHandle);
            if(!targetUser) {
                container.innerHTML = `<div style="padding:40px; text-align:center;">Specified profile target handle does not exist inside registry indexes.</div>`;
                return;
            }

            const isolatedUserPosts = runtimePostsArray.filter(p => p.owner === trackedTargetProfileContextHandle);
            let accumulatedLikesScore = 0;
            isolatedUserPosts.forEach(p => accumulatedLikesScore += p.likes.length);

            let profileGridBoxesHTML = "";
            isolatedUserPosts.forEach(p => {
                profileGridBoxesHTML += `
                    <div class="grid-cell-item" onclick="switchActiveViewTab('feed')">
                        <img src="${p.imageUrl}" alt="" loading="lazy">
                        <div class="grid-cell-hover-overlay">
                            <span>❤️ ${p.likes.length}</span>
                            <span>💬 ${p.comments.length}</span>
                        </div>
                    </div>
                `;
            });

            if(isolatedUserPosts.length === 0) {
                profileGridBoxesHTML = `<div style="grid-column: span 3; padding:50px 10px; text-align:center; color:var(--text-muted); font-size:12px;">No photography published to grid index yet.</div>`;
            }

            container.innerHTML = `
                <div class="profile-info-header liquid-glass">
                    <div class="profile-avatar-main"><img src="${targetUser.avatar}" alt=""></div>
                    <div class="profile-meta-block">
                        <div class="profile-user-row">
                            <h2 class="profile-handle">@${targetUser.username}</h2>
                        </div>
                        <div class="profile-stats-row">
                            <span><strong>${isolatedUserPosts.length}</strong> posts</span>
                            <span><strong>${accumulatedLikesScore}</strong> cumulative likes</span>
                        </div>
                        <div class="profile-bio-summary">
                            <h1>${targetUser.name}</h1>
                            <p>${targetUser.bio}</p>
                        </div>
                    </div>
                </div>

                <div class="insta-3col-grid">
                    ${profileGridBoxesHTML}
                </div>
            `;
        }

        /* System Block 8: Unified Interactions Engine (Likes, Comments, Deletions) */
        function togglePostLikingInteraction(postIdValue) {
            if(!sessionUserObjectHandle) { alert("Unauthenticated Rejection: Account sign-in required to toggle social metrics mapping."); return; }

            runtimePostsArray = runtimePostsArray.map(post => {
                if(post.id === postIdValue) {
                    const trackingIndex = post.likes.indexOf(sessionUserObjectHandle.username);
                    if(trackingIndex > -1) {
                        post.likes.splice(trackingIndex, 1);
                    } else {
                        post.likes.push(sessionUserObjectHandle.username);
                        // Trigger synthetic background notification activity instances
                        if(post.owner !== sessionUserObjectHandle.username) {
                            runtimeNotificationsArray.unshift({
                                id: "noti-gen-" + Date.now(),
                                type: "like",
                                message: `@${sessionUserObjectHandle.username} liked your published image post frame item context.`,
                                avatar: sessionUserObjectHandle.avatar
                            });
                        }
                    }
                }
                return post;
            });
            commitUpdatesToSystemStorageDevices();
            renderTimelinePostsStreamDOM();
        }

        function appendNewCommentTextStringLine(eventObj, postIdValue) {
            eventObj.preventDefault();
            if(!sessionUserObjectHandle) { alert("Unauthenticated Rejection: Create cloud account profile to attach post annotations comments."); return; }

            const targetedInputField = document.getElementById(`input-comm-${postIdValue}`);
            const commentString = targetedInputField.value.trim();
            if(!commentString) return;

            runtimePostsArray = runtimePostsArray.map(post => {
                if(post.id === postIdValue) {
                    post.comments.push({ author: sessionUserObjectHandle.username, line: commentString });
                    
                    if(post.owner !== sessionUserObjectHandle.username) {
                        runtimeNotificationsArray.unshift({
                            id: "noti-gen-" + Date.now(),
                            type: "comment",
                            message: `@${sessionUserObjectHandle.username} annotated: "${commentString.substring(0,20)}..." on your post artwork.`,
                            avatar: sessionUserObjectHandle.avatar
                        });
                    }
                }
                return post;
            });

            targetedInputField.value = "";
            commitUpdatesToSystemStorageDevices();
            renderTimelinePostsStreamDOM();
        }

        function executeTargetPostDestruction(postIdValue) {
            if(confirm("Confirm Deletion Mapping: Erase selected target configuration structural item row permanently from memory registry arrays?")) {
                runtimePostsArray = runtimePostsArray.filter(p => p.id !== postIdValue);
                commitUpdatesToSystemStorageDevices();
                if(document.getElementById('view-feed-panel').style.display === "block") {
                    renderTimelinePostsStreamDOM();
                } else {
                    renderUserProfileAnalyticsGridDOM();
                }
            }
        }

        /* System Block 9: Decoupled Non-Blocking Image Processing Upload Pipeline */
        const clickZoneNode = document.getElementById('decoupledFilePickerClickZone');
        const hiddenInputChannelNode = document.getElementById('isolatedSystemFileChannelInput');
        const visualPreviewTagNode = document.getElementById('preflightImageFramePreview');

        // Hook explicit operational listener bindings to isolate native call contexts safely
        if(clickZoneNode && hiddenInputChannelNode) {
            clickZoneNode.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                hiddenInputChannelNode.click();
            });
            hiddenInputChannelNode.addEventListener('change', executeImageExtractionStreamPipeline);
        }

        function toggleMediaModalDisplayState(shouldShowModalWindow) {
            const modalElement = document.getElementById('global-upload-modal');
            if(!modalElement) return;

            if(shouldShowModalWindow) {
                modalElement.style.display = "flex";
                lenis.stop();
            } else {
                modalElement.style.display = "none";
                localBinaryBase64StringPayload = "";
                if(visualPreviewTagNode) { visualPreviewTagNode.style.display = "none"; visualPreviewTagNode.src = "#"; }
                document.getElementById('pickerPromptLabel').innerText = "Click inside grid frame bounds to pick photo capture...";
                document.getElementById('captionInputStringField').value = "";
                lenis.start();
            }
        }

        function executeImageExtractionStreamPipeline(eventContext) {
            const rawFileHandle = eventContext.target.files[0];
            if(!rawFileHandle) return;

            const operationalReaderInstance = new FileReader();
            document.getElementById('pickerPromptLabel').innerText = "Processing binary context maps...";

            operationalReaderInstance.onload = function(completeProcessingEvent) {
                localBinaryBase64StringPayload = completeProcessingEvent.target.result;
                document.getElementById('pickerPromptLabel').innerText = `Loaded: "${rawFileHandle.name.substring(0,18)}..."`;
                
                // Unblock and pass context layout to target rendering container tags
                if(visualPreviewTagNode) {
                    visualPreviewTagNode.src = localBinaryBase64StringPayload;
                    visualPreviewTagNode.style.display = "block";
                }
            };
            operationalReaderInstance.readAsDataURL(rawFileHandle);
        }

        function commitDataStringToLiveTimelineDataset() {
            const textCaption = document.getElementById('captionInputStringField').value.trim() || "Bespoke fine-art photography capture asset portfolio row allocation context.";
            
            if(!localBinaryBase64StringPayload) {
                alert("Upload Failure: No target binary image base data context compiled inside current upload memory cache buffer.");
                return;
            }

            const freshPostStructObject = {
                id: "post-inst-code-" + Date.now(),
                owner: sessionUserObjectHandle.username,
                imageUrl: localBinaryBase64StringPayload,
                caption: textCaption,
                likes: [],
                comments: []
            };

            runtimePostsArray.unshift(freshPostStructObject);
            commitUpdatesToSystemStorageDevices();
            toggleMediaModalDisplayState(false);
            switchActiveViewTab('feed');
        }

        /* System Block 10: Interactive Notifications Panels Render Mechanics */
        function toggleNotificationsPanelDropdown() {
            const panel = document.getElementById('global-notifications-panel');
            if(!panel) return;

            if(panel.style.display === "flex") {
                panel.style.display = "none";
            } else {
                panel.style.display = "flex";
                renderNotificationsListItemsMarkup();
                // Clear state notifications indicators counters upon structural selection focus operations
                localStorage.setItem('RTIM_LAST_VIEWED_NOTI_COUNT_v4', runtimeNotificationsArray.length);
                evaluateNotificationBadgeDotAlertState();
            }
        }

        function renderNotificationsListItemsMarkup() {
            const wrapper = document.getElementById('notificationsInjectedTarget');
            if(!wrapper) return;
            wrapper.innerHTML = "";

            if(runtimeNotificationsArray.length === 0) {
                wrapper.innerHTML = `<div style="font-size:11px; text-align:center; color:var(--text-muted); padding:20px 0;">No system logs or activity trends compiled yet.</div>`;
                return;
            }

            runtimeNotificationsArray.forEach(noti => {
                const row = document.createElement('div');
                row.className = "noti-item-row";
                row.innerHTML = `
                    <img src="${noti.avatar}" class="noti-avatar" alt="">
                    <span>${noti.message}</span>
                `;
                wrapper.appendChild(row);
            });
        }

        function evaluateNotificationBadgeDotAlertState() {
            const dot = document.getElementById('notiTrackerDot');
            if(!dot) return;

            const cacheTrackerValue = parseInt(localStorage.getItem('RTIM_LAST_VIEWED_NOTI_COUNT_v4') || "0", 10);
            if(runtimeNotificationsArray.length > cacheTrackerValue) {
                dot.style.display = "block";
            } else {
                dot.style.display = "none";
            }
        }

        function initiateSecureMediaUploadSequence() {
            if(!sessionUserObjectHandle) {
                alert("Action Blocked: Anyone can browse the public photography, but an account login is required to post frames.");
                switchActiveViewTab('auth');
                return;
            }
            toggleMediaModalDisplayState(true);
        }

        // Initialize core engines on framework window payload loading events
        window.addEventListener('DOMContentLoaded', loadSystemCacheMemoryOnBootstrap);
    </script>
</body>
</html>
