<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillu Captures | Public Social Architecture</title>

    <!-- Typography and Visual Icon Subsystems -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #000000;
            --bg-gradient: radial-gradient(circle at 50% 0%, #131924 0%, #06080c 65%, #000000 100%);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --accent: #ff3040; /* Instagram Core Like Crimson */
            --gold: #D4AF37; /* Legacy Aesthetic Contrast Accents */
            --glass-sheet: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.11);
            --ios-blur: blur(35px) saturate(210%) brightness(1.02);
        }

        /* Essential Reset Configurations */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            background: var(--bg-base); background-image: var(--bg-gradient);
            color: var(--text-main); font-family: 'Inter', sans-serif;
            min-height: 100vh; overflow-x: hidden; padding-bottom: 90px;
        }

        /* Glassmorphic Core Specifications */
        .liquid-glass {
            background: var(--glass-sheet); backdrop-filter: var(--ios-blur); -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--glass-border); border-radius: 20px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 15px 45px rgba(0,0,0,0.6);
        }

        /* Sticky Global Top Header Architecture */
        .instagram-header-dock {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 9000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
            background: rgba(0,0,0,0.2); backdrop-filter: var(--ios-blur); -webkit-backdrop-filter: var(--ios-blur);
            border-bottom: 1px solid var(--glass-border);
        }
        .brand-signature { font-family: 'Cinzel', serif; font-size: 21px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; }
        .brand-signature span { color: var(--gold); }
        .header-auth-status { display: flex; align-items: center; gap: 14px; }

        /* Dynamic Section Router Configurations */
        .app-view-panel { display: none; opacity: 0; transform: translateY(12px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .active-view { display: block; opacity: 1; transform: translateY(0); }

        .container { max-width: 640px; margin: 0 auto; padding: 100px 16px 40px 16px; }

        /* Generic Core Buttons Layout */
        .action-btn {
            background: var(--text-main); color: #000; border: none; padding: 10px 18px; border-radius: 12px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .action-btn:hover { background: var(--gold); color: #fff; }
        .action-btn.secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--glass-border); }
        .action-btn.secondary:hover { background: rgba(255,255,255,0.15); }

        /* VIEW 1: HOME FEED ARCHITECTURE CARDS */
        .instagram-post-card { width: 100%; margin-bottom: 30px; overflow: hidden; border-radius: 20px; }
        .post-header-node { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
        .user-meta-zone { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar-circle {
            width: 34px; height: 34px; border-radius: 50%; padding: 2px;
            background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #bc1888 100%);
        }
        .user-avatar-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid #000; }
        .profile-name-string { font-size: 13px; font-weight: 600; }
        .delete-post-node { background: transparent; border: none; color: rgba(255,48,64,0.6); font-size: 11px; cursor: pointer; padding: 4px 8px; }

        .post-visual-viewport { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: #000; }
        .post-visual-viewport img { width: 100%; height: 100%; object-fit: cover; }

        .post-interactions-panel { padding: 14px 18px 6px 18px; display: flex; gap: 16px; }
        .interaction-trigger-item { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .interaction-trigger-item.liked-state { color: var(--accent); }
        .post-metrics-readout { padding: 0 18px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .post-caption-box { padding: 0 18px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
        .post-caption-box strong { color: var(--gold); margin-right: 6px; }

        .comments-dock-area { padding: 12px 18px 18px 18px; border-top: 1px solid rgba(255,255,255,0.04); }
        .comments-history-output { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .comment-node-string { font-size: 12px; }
        .comment-node-string strong { color: var(--text-main); margin-right: 6px; }
        .comment-input-form-box { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input-field { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }

        /* VIEW 2: INSTAGRAM PROFILE SPECIFICATIONS */
        .profile-container { max-width: 760px; margin: 0 auto; padding: 100px 16px 40px 16px; }
        .profile-header-card { padding: 30px; display: flex; gap: 40px; align-items: center; margin-bottom: 30px; }
        .profile-avatar-large { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); flex-shrink: 0; }
        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info-column { flex: 1; }
        .profile-meta-row { display: flex; align-items: center; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
        .profile-username-header { font-size: 20px; font-weight: 400; }
        .profile-metrics-row { display: flex; gap: 24px; margin-bottom: 14px; font-size: 14px; }
        .profile-metrics-row span strong { color: #fff; margin-right: 3px; }
        .profile-bio-text h1 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .profile-bio-text p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        /* 3-Column Image Layout Matrix */
        .instagram-grid-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .grid-matrix-cell { position: relative; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #080c12; cursor: pointer; border: 1px solid var(--glass-border); }
        .grid-matrix-cell img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .grid-matrix-cell:hover img { transform: scale(1.05); }
        .grid-cell-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; gap: 14px; font-size: 14px; font-weight: 600; }
        .grid-matrix-cell:hover .grid-cell-overlay { opacity: 1; }

        /* VIEW 3: DUAL REGISTER & SIGN IN CARD */
        .auth-master-card { max-width: 420px; margin: 120px auto 40px auto; padding: 40px; text-align: center; }
        .auth-master-card h2 { font-family: 'Cinzel', serif; font-size: 24px; margin-bottom: 6px; color: var(--gold); }
        .auth-master-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        .auth-toggle-header { display: flex; border-bottom: 1px solid var(--glass-border); margin-bottom: 24px; }
        .auth-toggle-btn { flex: 1; background: transparent; border: none; padding: 12px; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; }
        .auth-toggle-btn.active-tab { color: #fff; border-bottom: 2px solid var(--gold); }
        .input-control { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; margin-bottom: 14px; }
        .input-control:focus { border-color: var(--gold); }

        /* VIEW 4: BROADCAST MODAL BOX WINDOW */
        #global-upload-modal-view { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-body-panel { width: 100%; max-width: 440px; padding: 30px; position: relative; }
        .close-modal-trigger { position: absolute; top: 16px; right: 20px; background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .modal-body-panel h3 { font-family: 'Cinzel', serif; font-size: 18px; margin-bottom: 16px; text-align: center; }
        .file-dropzone-area { border: 2px dashed var(--glass-border); border-radius: 12px; padding: 30px 16px; text-align: center; cursor: pointer; margin-bottom: 16px; }
        .file-dropzone-area p { font-size: 12px; color: var(--text-muted); }

        /* Persistent Dynamic Sticky Footer Navigation Controller Dock */
        .ios-action-dock-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 440px; height: 60px; z-index: 9000; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; }
        .dock-action-node { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .dock-action-node:hover { background: rgba(255,255,255,0.08); color: var(--gold); }

        #scrollTrackerBar { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); width: 0%; z-index: 99999; }
    </style>
</head>
<body>

    <div id="scrollTrackerBar"></div>

    <!-- Top Navigation Layer -->
    <header class="instagram-header-dock">
        <div class="brand-signature" onclick="navigateToAppSection('feed')">Dillu_<span>Captures</span></div>
        <div class="header-auth-status" id="headerAuthPanelControls">
            <!-- Programmatically Injected Login / Signout Triggers -->
        </div>
    </header>

    <!-- UI ROUTER CHANNELS TARGETS -->

    <!-- VIEW 1: CENTRAL GENERAL FEED TIMELINE -->
    <section id="view-feed" class="app-view-panel container">
        <div id="timelineFeedInjectedWrapper"></div>
    </section>

    <!-- VIEW 2: INSTAGRAM MATRICES PROFILE VIEW -->
    <section id="view-profile" class="app-view-panel profile-container">
        <div id="profileContextInjectedWrapper"></div>
    </section>

    <!-- VIEW 3: SYSTEM MULTI-USER AUTHENTICATION HUB (LOGIN / REGISTER) -->
    <section id="view-auth" class="app-view-panel">
        <div class="auth-master-card liquid-glass">
            <h2 id="authInterfaceHeadline">Welcome Back</h2>
            <p id="authInterfaceSubtext">Access your public photography timeline index profile.</p>
            
            <div class="auth-toggle-header">
                <button id="toggleLoginModeBtn" class="auth-toggle-btn active-tab" onclick="switchAuthModeTab('login')">Sign In</button>
                <button id="toggleRegisterModeBtn" class="auth-toggle-btn" onclick="switchAuthModeTab('register')">Create Account</button>
            </div>

            <!-- Single Input Controller Processing Grid -->
            <form id="systemAuthInputPipelineForm" onsubmit="executeAuthenticationChallenge(event)">
                <div id="extendedRegisterFieldsGroup" style="display: none;">
                    <input type="text" id="authFullNameField" class="input-control" placeholder="Full Profile Name (e.g. Jane Doe)">
                    <input type="text" id="authBioSummaryField" class="input-control" placeholder="Bio Summary (e.g. Editorial Photographer)">
                </div>
                <input type="text" id="authUsernameField" class="input-control" placeholder="Unique Username" required autocomplete="off">
                <input type="password" id="authPasswordField" class="input-control" placeholder="Account Security Password" required>
                
                <button type="submit" id="authExecutionSubmitTrigger" class="action-btn" style="width: 100%; padding: 14px; margin-top: 10px;">Authenticate Access</button>
            </form>
        </div>
    </section>

    <!-- VIEW 4: MEDIA COMPILATION MODAL WINDOW BLOCKS -->
    <div id="global-upload-modal-view" onclick="if(event.target === this) toggleMediaUploadModalWindow(false)">
        <div class="modal-body-panel liquid-glass">
            <button class="close-modal-trigger" onclick="toggleMediaUploadModalWindow(false)">×</button>
            <h3>Publish Capture Target</h3>
            
            <div class="file-dropzone-area" onclick="document.getElementById('nativeSystemFilePicker').click()">
                <p id="dropzoneStatusStringPrompt">Click inside grid frame bounds to select desktop or mobile photo image file...</p>
                <input type="file" id="nativeSystemFilePicker" accept="image/*" style="display: none;" onchange="convertUploadedImageToBase64String(event)">
            </div>

            <input type="text" id="newFrameCaptionTextField" class="input-control" placeholder="Write comprehensive frame context caption layout...">
            <button class="action-btn" style="width: 100%; padding: 14px; margin-top: 8px;" onclick="commitNewMediaPostToTimeline()">Broadcast Image Frame</button>
        </div>
    </div>

    <!-- Constant Sticky Footer Control Center Modules -->
    <nav class="ios-action-dock-bar liquid-glass">
        <button class="dock-action-node" onclick="navigateToAppSection('feed')" title="Timeline Feed">🏠</button>
        <button class="dock-action-node" onclick="initiateSecureMediaUploadSequence()" title="Publish Frame">➕</button>
        <button class="dock-action-node" id="footerNavProfileShortcutNode" onclick="navigateToAppSection('profile')" title="My Profile">👤</button>
    </nav>

    <!-- Lenis Library Integration -->
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script>
        /* Engine Core 1: System Scrolling Track Engines */
        const lenis = new Lenis({ duration: 1.1, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -11 * t)), smoothWheel: true });
        function renderingAnimationFrameStep(timeValue) {
            lenis.raf(timeValue);
            const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            const markerBar = document.getElementById('scrollTrackerBar');
            if(markerBar) markerBar.style.width = scrollPercent + '%';
            requestAnimationFrame(renderingAnimationFrameStep);
        }
        requestAnimationFrame(renderingAnimationFrameStep);

        /* Engine Core 2: Seed Dataset Allocations */
        const seedUsersStore = [
            { username: "dillu_captures", password: "123", name: "Dillu Captures Official", bio: "Luxury lifestyle, fine-art configurations, and editorial architectural photography across India.", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" },
            { username: "creative_lens", password: "123", name: "Alex Mercer", bio: "Visualizing organic patterns via clean continuous custom natural light setups.", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80" }
        ];

        const seedPostsStore = [
            { id: "seed-post-1", owner: "dillu_captures", imageUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80", caption: "Timeless matrimonial structural geometric configurations. Organized light framework.", likes: ["creative_lens"], comments: [{ author: "creative_lens", line: "This contrast metric curve is flawlessly balanced!" }] },
            { id: "seed-post-2", owner: "creative_lens", imageUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80", caption: "Continuous portrait illumination monitoring internal lifecycle elegance.", likes: [], comments: [] }
        ];

        let activeUserRegistryState = [];
        let activeGlobalTimelinePosts = [];
        let currentlyAuthenticatedUser = null; 
        let activeCurrentAuthTabState = "login"; 
        let temporaryCachedBase64String = "";
        let trackedTargetProfileContextUsername = "";

        /* Engine Core 3: System State Synchronizers */
        function loadPlatformMemoryEngines() {
            if(!localStorage.getItem('IG_ENGINE_USERS_REGISTRY')) {
                localStorage.setItem('IG_ENGINE_USERS_REGISTRY', JSON.stringify(seedUsersStore));
                localStorage.setItem('IG_ENGINE_TIMELINE_POSTS', JSON.stringify(seedPostsStore));
            }
            activeUserRegistryState = JSON.parse(localStorage.getItem('IG_ENGINE_USERS_REGISTRY'));
            activeGlobalTimelinePosts = JSON.parse(localStorage.getItem('IG_ENGINE_TIMELINE_POSTS'));
            
            const localSessionToken = localStorage.getItem('IG_ENGINE_SESSION_TOKEN');
            if(localSessionToken) {
                currentlyAuthenticatedUser = activeUserRegistryState.find(u => u.username === localSessionToken) || null;
            }
            evaluateHeaderNavigationControlsDOM();
            navigateToAppSection('feed');
        }

        function commitPlatformMemoryEngineUpdates() {
            localStorage.setItem('IG_ENGINE_USERS_REGISTRY', JSON.stringify(activeUserRegistryState));
            localStorage.setItem('IG_ENGINE_TIMELINE_POSTS', JSON.stringify(activeGlobalTimelinePosts));
            evaluateHeaderNavigationControlsDOM();
        }

        /* Engine Core 4: App Navigation & Router Controls */
        function navigateToAppSection(destinationSectionViewCode, operationalContextString = null) {
            document.querySelectorAll('.app-view-panel').forEach(panel => panel.classList.remove('active-view'));
            
            if(destinationSectionViewCode === 'feed') {
                document.getElementById('view-feed').classList.add('active-view');
                renderCentralTimelineFeedDOM();
            } else if(destinationSectionViewCode === 'profile') {
                trackedTargetProfileContextUsername = operationalContextString || (currentlyAuthenticatedUser ? currentlyAuthenticatedUser.username : "dillu_captures");
                document.getElementById('view-profile').classList.add('active-view');
                renderInstagramProfileLayoutDOM();
            } else if(destinationSectionViewCode === 'auth') {
                document.getElementById('view-auth').classList.add('active-view');
            }
            lenis.scrollTo(0, { immediate: true });
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 50);
        }

        function evaluateHeaderNavigationControlsDOM() {
            const containerNode = document.getElementById('headerAuthPanelControls');
            if(!containerNode) return;

            if(currentlyAuthenticatedUser) {
                containerNode.innerHTML = `
                    <span style="font-size:12px; color:var(--gold); font-weight:600;">@${currentlyAuthenticatedUser.username}</span>
                    <button class="action-btn secondary" onclick="executeProfileSignoutSequence()">Sign Out</button>
                `;
            } else {
                containerNode.innerHTML = `
                    <button class="action-btn" onclick="navigateToAppSection('auth')">Sign In / Register</button>
                `;
            }
        }

        /* Engine Core 5: Sign In & Public Sign Up Implementation Engines */
        function switchAuthModeTab(targetTabSelector) {
            activeCurrentAuthTabState = targetTabSelector;
            document.getElementById('toggleLoginModeBtn').classList.remove('active-tab');
            document.getElementById('toggleRegisterModeBtn').classList.remove('active-tab');
            
            const registerFieldsBox = document.getElementById('extendedRegisterFieldsGroup');

            if(targetTabSelector === 'login') {
                document.getElementById('toggleLoginModeBtn').classList.add('active-tab');
                document.getElementById('authInterfaceHeadline').innerText = "Welcome Back";
                document.getElementById('authInterfaceSubtext').innerText = "Access your public photography timeline index profile.";
                registerFieldsBox.style.display = "none";
            } else {
                document.getElementById('toggleRegisterModeBtn').classList.add('active-tab');
                document.getElementById('authInterfaceHeadline').innerText = "Create Public Account";
                document.getElementById('authInterfaceSubtext').innerText = "Join the photography index to showcase frames publicly.";
                registerFieldsBox.style.display = "block";
            }
        }

        function executeAuthenticationChallenge(eventObj) {
            eventObj.preventDefault();
            const targetUsernameInput = document.getElementById('authUsernameField').value.trim().toLowerCase();
            const targetPasswordInput = document.getElementById('authPasswordField').value;

            if(activeCurrentAuthTabState === 'login') {
                const userMatch = activeUserRegistryState.find(u => u.username === targetUsernameInput && u.password === targetPasswordInput);
                if(userMatch) {
                    currentlyAuthenticatedUser = userMatch;
                    localStorage.setItem('IG_ENGINE_SESSION_TOKEN', userMatch.username);
                    commitPlatformMemoryEngineUpdates();
                    navigateToAppSection('feed');
                } else {
                    alert("Authentication Error: Invalid profile username or secure account password pattern configuration.");
                }
            } else {
                // Public Account Creation Handling Pipelines
                const targetFullNameInput = document.getElementById('authFullNameField').value.trim() || "Public Contributor";
                const targetBioSummaryInput = document.getElementById('authBioSummaryField').value.trim() || "Photography enthusiast profile frame.";

                if(activeUserRegistryState.some(u => u.username === targetUsernameInput)) {
                    alert("Registration Blocked: Chosen username profile parameters already exist inside registry memory.");
                    return;
                }

                const brandNewUserObjectInstance = {
                    username: targetUsernameInput,
                    password: targetPasswordInput,
                    name: targetFullNameInput,
                    bio: targetBioSummaryInput,
                    avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" // Baseline fallback placeholder asset avatar string 
                };

                activeUserRegistryState.push(brandNewUserObjectInstance);
                currentlyAuthenticatedUser = brandNewUserObjectInstance;
                localStorage.setItem('IG_ENGINE_SESSION_TOKEN', brandNewUserObjectInstance.username);
                commitPlatformMemoryEngineUpdates();
                
                // Clear validation field input sets
                document.getElementById('authFullNameField').value = "";
                document.getElementById('authBioSummaryField').value = "";
                document.getElementById('authUsernameField').value = "";
                document.getElementById('authPasswordField').value = "";

                navigateToAppSection('profile', currentlyAuthenticatedUser.username);
            }
        }

        function executeProfileSignoutSequence() {
            currentlyAuthenticatedUser = null;
            localStorage.removeItem('IG_ENGINE_SESSION_TOKEN');
            commitPlatformMemoryEngineUpdates();
            navigateToAppSection('feed');
        }

        /* Engine Core 6: Live Timeline Feed Builders */
        function renderCentralTimelineFeedDOM() {
            const container = document.getElementById('timelineFeedInjectedWrapper');
            if(!container) return;
            container.innerHTML = "";

            if(activeGlobalTimelinePosts.length === 0) {
                container.innerHTML = `<div class="liquid-glass" style="padding:40px; text-align:center; color:var(--text-muted); font-size:13px;">No photography published to public databases yet.</div>`;
                return;
            }

            activeGlobalTimelinePosts.forEach(post => {
                const authorAccount = activeUserRegistryState.find(u => u.username === post.owner) || { name: "Unknown", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" };
                const isItemDeletable = currentlyAuthenticatedUser && (currentlyAuthenticatedUser.username === post.owner || currentlyAuthenticatedUser.username === "dillu_captures");
                const userHasLikedItem = currentlyAuthenticatedUser && post.likes.includes(currentlyAuthenticatedUser.username);

                let inlineCommentsBufferHTML = "";
                post.comments.forEach(c => {
                    inlineCommentsBufferHTML += `<div class="comment-node-string"><strong>@${c.author}</strong>${c.line}</div>`;
                });

                const postCardMarkupElement = document.createElement('article');
                postCardMarkupElement.className = "instagram-post-card liquid-glass";
                postCardMarkupElement.innerHTML = `
                    <div class="post-header-node">
                        <div class="user-meta-zone" onclick="navigateToAppSection('profile', '${post.owner}')">
                            <div class="user-avatar-circle"><img src="${authorAccount.avatar}" alt=""></div>
                            <span class="profile-name-string">${post.owner}</span>
                        </div>
                        ${isItemDeletable ? `<button class="delete-post-node" onclick="executeTimelinePostDeletion('${post.id}')">Delete</button>` : ''}
                    </div>

                    <div class="post-visual-viewport" ondblclick="toggleTimelinePostLikingState('${post.id}')">
                        <img src="${post.imageUrl}" alt="Visual Content Capture Block" loading="lazy">
                    </div>

                    <div class="post-interactions-panel">
                        <button class="interaction-trigger-item ${userHasLikedItem ? 'liked-state' : ''}" onclick="toggleTimelinePostLikingState('${post.id}')">
                            ${userHasLikedItem ? '❤️' : '🤍'}
                        </button>
                        <button class="interaction-trigger-item" onclick="document.getElementById('comment-input-node-${post.id}').focus()">💬</button>
                    </div>

                    <div class="post-metrics-readout"><span>${post.likes.length} likes</span></div>

                    <div class="post-caption-box"><strong>${post.owner}</strong>${post.caption}</div>

                    <div class="comments-dock-area">
                        <div class="comments-history-output">${inlineCommentsBufferHTML}</div>
                        <form class="comment-input-form-box" onsubmit="commitUserAnnotationCommentLine(event, '${post.id}')">
                            <input type="text" id="comment-input-node-${post.id}" class="comment-input-field" placeholder="Add custom comment note..." required autocomplete="off">
                        </form>
                    </div>
                `;
                container.appendChild(postCardMarkupElement);
            });
        }

        /* Engine Core 7: Instagram Grid & Metrics Profile Builders */
        function renderInstagramProfileLayoutDOM() {
            const container = document.getElementById('profileContextInjectedWrapper');
            if(!container) return;
            container.innerHTML = "";

            const targetedProfileObjectData = activeUserRegistryState.find(u => u.username === trackedTargetProfileContextUsername);
            if(!targetedProfileObjectData) {
                container.innerHTML = `<div class="liquid-glass" style="padding:40px; text-align:center;">Target profile directory index not found.</div>`;
                return;
            }

            const historicalUserPostsCollection = activeGlobalTimelinePosts.filter(p => p.owner === trackedTargetProfileContextUsername);
            
            // Collate absolute interactive like computations across individual historical elements
            let rollingSumLikesCount = 0;
            historicalUserPostsCollection.forEach(p => rollingSumLikesCount += p.likes.length);

            let structureGridCellsHTML = "";
            historicalUserPostsCollection.forEach(p => {
                structureGridCellsHTML += `
                    <div class="grid-matrix-cell" onclick="navigateToAppSection('feed')">
                        <img src="${p.imageUrl}" alt="" loading="lazy">
                        <div class="grid-cell-overlay">
                            <span>❤️ ${p.likes.length}</span>
                            <span>💬 ${p.comments.length}</span>
                        </div>
                    </div>
                `;
            });

            if(historicalUserPostsCollection.length === 0) {
                structureGridCellsHTML = `<div style="grid-column: span 3; padding: 60px 20px; text-align:center; color:var(--text-muted); font-size:13px;">No published showcase grids currently configured.</div>`;
            }

            container.innerHTML = `
                <div class="profile-header-card liquid-glass">
                    <div class="profile-avatar-large"><img src="${targetedProfileObjectData.avatar}" alt=""></div>
                    <div class="profile-info-column">
                        <div class="profile-meta-row">
                            <h2 class="profile-username-header">@${targetedProfileObjectData.username}</h2>
                        </div>
                        <div class="profile-metrics-row">
                            <span><strong>${historicalUserPostsCollection.length}</strong> posts</span>
                            <span><strong>${rollingSumLikesCount}</strong> total likes</span>
                        </div>
                        <div class="profile-bio-text">
                            <h1>${targetedProfileObjectData.name}</h1>
                            <p>${targetedProfileObjectData.bio}</p>
                        </div>
                    </div>
                </div>

                <div class="instagram-grid-matrix">
                    ${structureGridCellsHTML}
                </div>
            `;
        }

        /* Engine Core 8: Direct Social Interactions Pipeline Framework */
        function toggleTimelinePostLikingState(targetPostId) {
            if(!currentlyAuthenticatedUser) {
                alert("Action Blocked: Anonymous actions are protected. Please create an account or sign in to configure likes.");
                navigateToAppSection('auth');
                return;
            }

            activeGlobalTimelinePosts = activeGlobalTimelinePosts.map(post => {
                if(post.id === targetPostId) {
                    const trackingIdx = post.likes.indexOf(currentlyAuthenticatedUser.username);
                    if(trackingIdx > -1) {
                        post.likes.splice(trackingIdx, 1);
                    } else {
                        post.likes.push(currentlyAuthenticatedUser.username);
                    }
                }
                return post;
            });
            commitPlatformMemoryEngineUpdates();
            renderCentralTimelineFeedDOM();
        }

        function commitUserAnnotationCommentLine(eventObj, targetPostId) {
            eventObj.preventDefault();
            if(!currentlyAuthenticatedUser) {
                alert("Action Blocked: Please log in to publish feedback annotations.");
                navigateToAppSection('auth');
                return;
            }

            const inputNode = document.getElementById(`comment-input-node-${targetPostId}`);
            const commentText = inputNode.value.trim();
            if(!commentText) return;

            activeGlobalTimelinePosts = activeGlobalTimelinePosts.map(post => {
                if(post.id === targetPostId) {
                    post.comments.push({ author: currentlyAuthenticatedUser.username, line: commentText });
                }
                return post;
            });

            inputNode.value = "";
            commitPlatformMemoryEngineUpdates();
            renderCentralTimelineFeedDOM();
        }

        function executeTimelinePostDeletion(targetPostId) {
            if(confirm("Confirm Deletion Request: Permanently clear this object matrix instance from live view panels?")) {
                activeGlobalTimelinePosts = activeGlobalTimelinePosts.filter(p => p.id !== targetPostId);
                commitPlatformMemoryEngineUpdates();
                if(document.getElementById('view-feed').classList.contains('active-view')) {
                    renderCentralTimelineFeedDOM();
                } else {
                    renderInstagramProfileLayoutDOM();
                }
            }
        }

        /* Engine Core 9: Local Multi-User Image Upload Pipelines */
        function initiateSecureMediaUploadSequence() {
            if(!currentlyAuthenticatedUser) {
                alert("Action Blocked: Anyone can browse publicly, but account registration is required to upload frames.");
                navigateToAppSection('auth');
                return;
            }
            toggleMediaUploadModalWindow(true);
        }

        function toggleMediaUploadModalWindow(shouldShowModal) {
            const modal = document.getElementById('global-upload-modal-view');
            if(shouldShowShowModal || shouldShowModal) {
                modal.style.display = "flex";
                lenis.stop();
            } else {
                modal.style.display = "none";
                temporaryCachedBase64String = "";
                document.getElementById('dropzoneStatusStringPrompt').innerText = "Click inside grid frame bounds to select desktop or mobile photo image file...";
                document.getElementById('newFrameCaptionTextField').value = "";
                lenis.start();
            }
        }

        function convertUploadedImageToBase64String(eventObj) {
            const imageFileHandle = eventObj.target.files[0];
            if(!imageFileHandle) return;

            const trackingReaderInstance = new FileReader();
            document.getElementById('dropzoneStatusStringPrompt').innerText = "Compressing multi-layer asset pixel matrices...";
            
            trackingReaderInstance.onload = function(completeEvent) {
                temporaryCachedBase64String = completeEvent.target.result;
                document.getElementById('dropzoneStatusStringPrompt').innerText = `Loaded: "${imageFileHandle.name}". Allocation ready to publish!`;
            };
            trackingReaderInstance.readAsDataURL(imageFileHandle);
        }

        function commitNewMediaPostToTimeline() {
            const captionValue = document.getElementById('newFrameCaptionTextField').value.trim() || "Showcase capture asset configuration.";
            
            if(!temporaryCachedBase64String) {
                alert("Compilation Blocked: Please map an active system file handle configuration matrix before publishing.");
                return;
            }

            const freshGeneratedPostInstance = {
                id: "custom-post-matrix-" + Date.now(),
                owner: currentlyAuthenticatedUser.username,
                imageUrl: temporaryCachedBase64String,
                caption: captionValue,
                likes: [],
                comments: []
            };

            activeGlobalTimelinePosts.unshift(freshGeneratedPostInstance);
            commitPlatformMemoryEngineUpdates();
            toggleMediaUploadModalWindow(false);
            navigateToAppSection('feed');
        }

        // Initialize engine environments on bootstrap trigger
        window.addEventListener('DOMContentLoaded', loadPlatformMemoryEngines);
    </script>
</body>
</html>
