<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dillu Captures | Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#08131f,#101d34,#0c0f19);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:#4b6fff;
border-radius:50%;
filter:blur(160px);
left:-180px;
top:-180px;
opacity:.4;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#00d2ff;
border-radius:50%;
filter:blur(160px);
right:-150px;
bottom:-150px;
opacity:.25;
}

.login-card{
position:relative;
width:380px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 60px rgba(0,0,0,.45);
animation:fade .8s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
text-align:center;
font-size:32px;
margin-bottom:10px;
}

h2{
color:#fff;
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#cfd8e6;
margin-bottom:30px;
font-size:14px;
}

.input-box{
margin-bottom:18px;
}

.input-box label{
display:block;
margin-bottom:8px;
color:#fff;
font-size:14px;
}

.input-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.12);
color:white;
font-size:15px;
}

.input-box input::placeholder{
color:#ccc;
}

.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:15px;
top:14px;
cursor:pointer;
color:white;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
margin-bottom:20px;
color:white;
}

.options a{
color:#7dcfff;
text-decoration:none;
}

.options a:hover{
text-decoration:underline;
}

.login-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#4f8cff,#00d4ff);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(0,212,255,.4);
}

.register{
margin-top:25px;
text-align:center;
color:white;
}

.register a{
color:#00d4ff;
text-decoration:none;
font-weight:bold;
}

.register a:hover{
text-decoration:underline;
}

.footer{
margin-top:30px;
text-align:center;
font-size:12px;
color:#b8b8b8;
}

@media(max-width:450px){

.login-card{
width:92%;
padding:30px;
}

}
</style>
</head>

<body>

<div class="login-card">

<div class="logo">📸</div>

<h2>Dillu Captures</h2>

<p class="subtitle">
Welcome Back! Login to your account.
</p>

<form action="dashboard.html" method="post">

<div class="input-box">
<label>Email Address</label>
<input
type="email"
placeholder="Enter your email"
required>
</div>

<div class="input-box password-box">
<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<span onclick="togglePassword()">👁</span>

</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button class="login-btn">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

<div class="footer">
© 2026 Dillu Captures • All Rights Reserved
</div>

</div>

<script>

function togglePassword(){

var x=document.getElementById("password");

if(x.type==="password"){
x.type="text";
}
else{
x.type="password";
}

}

</script>

</body>
</html>
