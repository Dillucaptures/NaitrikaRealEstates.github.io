<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillu Captures | Professional Photography</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at center, #2c3e50, #000000);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
        }

        /* Header Buttons */
        .header-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            align-items: center;
        }
        .profile-img {
            width: 100%;
            height: 300px;
            background: #444;
            border-radius: 20px;
        }
        .stats {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .service-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navigation -->
    <div class="header-btns">
        <button class="btn">Book Session</button>
        <button class="btn">View Portfolio</button>
    </div>

    <!-- Portfolio Reference -->
    <div class="glass-panel">
        <h2>Portfolio</h2>
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
            <div style="height:200px; background:#333; border-radius:10px;"></div>
            <div style="height:200px; background:#333; border-radius:10px;"></div>
            <div style="height:200px; background:#333; border-radius:10px;"></div>
            <div style="height:200px; background:#333; border-radius:10px;"></div>
        </div>
    </div>

    <!-- About Me -->
    <div class="glass-panel about-grid">
        <div class="profile-img"></div>
        <div>
            <h1>I'm Dillu: Your Professional Photographer</h1>
            <p>Capturing the art of the moment with years of industry expertise.</p>
            <div class="stats">
                <div><h3>1000+</h3><p>Happy Clients</p></div>
                <div><h3>8+</h3><p>Years</p></div>
                <div><h3>500+</h3><p>Events</p></div>
            </div>
        </div>
    </div>

    <!-- Services -->
    <div class="glass-panel">
        <h2>Services</h2>
        <div class="services-grid">
            <div class="service-card">Wedding Photography</div>
            <div class="service-card">Maternity Sessions</div>
            <div class="service-card">Baby Shoots</div>
            <div class="service-card">Family Portraits</div>
        </div>
    </div>
</div>

</body>
</html>
