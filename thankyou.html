<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Dillu Captures</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#0f172a
);
}

.background-glow{
position:absolute;
width:500px;
height:500px;
border-radius:50%;
background:rgba(79,124,255,.15);
filter:blur(120px);
animation:float 8s ease-in-out infinite;
}

.background-glow:nth-child(2){
width:400px;
height:400px;
right:-100px;
bottom:-100px;
animation-delay:2s;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-40px);
}
}

.card{
position:relative;
z-index:2;
width:100%;
max-width:700px;
padding:60px 40px;
text-align:center;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.12);

border-radius:32px;

box-shadow:
0 25px 60px rgba(0,0,0,.35);

animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
font-family:'Playfair Display',serif;
font-size:3rem;
font-weight:700;
color:white;
margin-bottom:20px;
letter-spacing:1px;
animation:pulse 3s infinite;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.04);
}
}

.camera-icon{
font-size:4rem;
margin-bottom:15px;
animation:bounce 2.5s infinite;
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-12px);
}
}

.success{
font-size:5rem;
margin-bottom:15px;
animation:pop 1s ease;
}

@keyframes pop{
0%{
transform:scale(0);
}
100%{
transform:scale(1);
}
}

h1{
font-family:'Playfair Display',serif;
font-size:3rem;
color:white;
margin-bottom:15px;
}

p{
font-size:1.05rem;
color:#cbd5e1;
line-height:1.8;
margin-bottom:12px;
}

.highlight{
color:#6ea8ff;
font-weight:600;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:35px;
flex-wrap:wrap;
}

.btn{
text-decoration:none;
padding:14px 28px;
border-radius:999px;
font-weight:600;
transition:.3s;
}

.home-btn{
background:#4f7cff;
color:white;
}

.home-btn:hover{
transform:translateY(-3px);
}

.insta-btn{
background:linear-gradient(
45deg,
#f58529,
#dd2a7b,
#8134af,
#515bd4
);
color:white;
}

.insta-btn:hover{
transform:translateY(-3px);
}

.footer{
margin-top:35px;
font-size:.9rem;
color:#94a3b8;
}

@media(max-width:768px){

.logo{
font-size:2.2rem;
}

h1{
font-size:2.2rem;
}

.card{
padding:40px 25px;
}

.success{
font-size:4rem;
}

}

</style>
</head>

<body>

<div class="background-glow"></div>
<div class="background-glow"></div>

<div class="card">

<div class="camera-icon">📸</div>

<div class="logo">
Dillu Captures
</div>

<div class="success">
✅
</div>

<h1>Thank You!</h1>

<p>
Your enquiry has been submitted successfully.
</p>

<p>
Thank you for choosing
<span class="highlight">Dillu Captures</span>.
</p>

<p>
We have received your message and will contact you shortly regarding your photography requirements.
</p>

<div class="buttons">

<a href="index.html" class="btn home-btn">
🏠 Return Home
</a>

<a href="https://instagram.com/dillu_captures"
target="_blank"
class="btn insta-btn">
📷 Follow on Instagram
</a>

</div>

<div class="footer">
© 2026 Dillu Captures Photography
</div>

</div>

</body>
</html>
