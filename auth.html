<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillu Captures | Secure Portal</title>
    <style>
        :root {
            --glass-bg: rgba(0, 0, 0, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-glow: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --instagram-blue: #0095f6;
            --instagram-blue-hover: #1877f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SONY CAMERA BACKGROUND SCENE --- */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1610136649349-0f646f318053?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- INSTAGRAM ALIGNED HOUSING --- */
        .auth-container {
            width: 100%;
            max-width: 385px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .liquid-glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .brand-logo {
            font-size: 2rem;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 8px;
            position: relative;
        }

        .glass-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.8);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .action-button {
            width: 100%;
            padding: 12px;
            background: var(--instagram-blue);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 14px;
            transition: background-color 0.2s;
        }

        .action-button:hover { background-color: var(--instagram-blue-hover); }
        .action-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .or-divider::before, .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }
        .or-divider::before { margin-right: 18px; }
        .or-divider::after { margin-left: 18px; }

        .google-auth-trigger {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .google-auth-trigger svg { width: 16px; height: 16px; fill: currentColor; }

        .status-toast {
            font-size: 12px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            line-height: 16px;
        }
        .status-toast.error { background: rgba(255, 59, 48, 0.2); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.3); }
        .status-toast.success { background: rgba(48, 209, 88, 0.2); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.3); }

        .toggle-view-card {
            padding: 20px;
            font-size: 14px;
            color: var(--text-primary);
        }
        .toggle-view-card a {
            color: var(--instagram-blue);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }
        .toggle-view-card a:hover { text-decoration: underline; }

        /* Context Layer Views Visibility Switches */
        .signup-context { display: none; }
        body.signup-active .signup-context { display: block; }
        body.signup-active .login-context { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="liquid-glass-card">
            <div class="brand-logo">DILLU CAPTURES</div>
            
            <form id="authForm">
                <!-- LOGIN INPUT CONTAINER (Unified Matrix Box) -->
                <div class="input-group login-context">
                    <input type="text" id="loginIdentifierField" class="glass-input" placeholder="Phone number, username, or email">
                </div>

                <!-- SIGNUP INPUT CONTAINERS -->
                <div class="input-group signup-context">
                    <input type="email" id="signupEmailField" class="glass-input" placeholder="Email address">
                </div>
                <div class="input-group signup-context">
                    <input type="text" id="signupNameField" class="glass-input" placeholder="Full Name">
                </div>
                <div class="input-group signup-context">
                    <input type="text" id="signupUsernameField" class="glass-input" placeholder="Username">
                </div>
                <div class="input-group signup-context">
                    <input type="text" id="signupPhoneField" class="glass-input" placeholder="Mobile Number">
                </div>

                <!-- UNIFIED PASSWORD COMPONENT -->
                <div class="input-group">
                    <input type="password" id="passwordField" class="glass-input" placeholder="Password" required>
                </div>

                <button type="submit" id="mainActionButton" class="action-button">Log In</button>
            </form>

            <div class="or-divider">or</div>

            <button type="button" class="google-auth-trigger" id="googleAuthButton">
                <svg viewBox="0 0 24 24">
                    <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.997 0-.746-.08-1.32-.176-1.898H12.24z"/>
                </svg>
                Log in with Google
            </button>

            <div id="statusToast" class="status-toast"></div>
        </div>

        <div class="liquid-glass-card toggle-view-card">
            <span class="login-context">Don't have an account?<a href="#" id="switchToSignUp">Sign up</a></span>
            <span class="signup-context">Have an account?<a href="#" id="switchToLogIn">Log in</a></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDocs, 
            collection, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Verified Original Config Structure Mapping
        const firebaseConfig = {
            apiKey: "AIzaSyATrPSHyg8SS6BzafsoFYI71g2-vAbMYjU",
            authDomain: "dillucaptures07.firebaseapp.com",
            projectId: "dillucaptures07",
            storageBucket: "dillucaptures07.firebasestorage.app",
            messagingSenderId: "331192229836",
            appId: "1:331192229836:web:dbde836b8e043558038769",
            measurementId: "G-R0ES0XEHSV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const bodyNode = document.body;
        const authForm = document.getElementById('authForm');
        const passwordInput = document.getElementById('passwordField');
        const submitBtn = document.getElementById('mainActionButton');
        const googleBtn = document.getElementById('googleAuthButton');
        const statusToast = document.getElementById('statusToast');
        
        // Form specific node assignments
        const loginIdentifierField = document.getElementById('loginIdentifierField');
        const signupEmailField = document.getElementById('signupEmailField');
        const signupNameField = document.getElementById('signupNameField');
        const signupUsernameField = document.getElementById('signupUsernameField');
        const signupPhoneField = document.getElementById('signupPhoneField');

        let checkSignUpStateActive = false;

        document.getElementById('switchToSignUp').addEventListener('click', (e) => {
            e.preventDefault();
            checkSignUpStateActive = true;
            bodyNode.classList.add('signup-active');
            submitBtn.textContent = "Sign Up";
            clearToast();
        });

        document.getElementById('switchToLogIn').addEventListener('click', (e) => {
            e.preventDefault();
            checkSignUpStateActive = false;
            bodyNode.classList.remove('signup-active');
            submitBtn.textContent = "Log In";
            clearToast();
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearToast();
            submitBtn.disabled = true;

            const targetPasswordValue = passwordInput.value;

            if (checkSignUpStateActive) {
                // RUN SIGN UP PIPELINE REGISTERING UNIQUE IDENTIFIERS
                const email = signupEmailField.value.trim();
                const name = signupNameField.value.trim();
                const username = signupUsernameField.value.trim().toLowerCase();
                const phone = signupPhoneField.value.trim();

                if(!email || !username || !phone) {
                    displayToast("Please populate all requested parameters.", "error");
                    submitBtn.disabled = false;
                    return;
                }

                try {
                    // Check if username/phone exists in cross-reference database first
                    const userRef = collection(db, "users");
                    const usernameCheck = await getDocs(query(userRef, where("username", "==", username)));
                    if (!usernameCheck.empty) {
                        throw { code: 'custom/username-taken' };
                    }

                    const credentialsReceipt = await createUserWithEmailAndPassword(auth, email, targetPasswordValue);
                    await updateProfile(credentialsReceipt.user, { displayName: name || username });
                    
                    // Index identifier routing map into Firestore
                    await setDoc(doc(db, "users", credentialsReceipt.user.uid), {
                        uid: credentialsReceipt.user.uid,
                        email: email,
                        username: username,
                        phone: phone,
                        displayName: name
                    });

                    displayToast("Account initialized successfully! Routing access...", "success");
                    redirectUserToDashboard();
                } catch (error) {
                    displayToast(parseFirebaseErrorMessage(error.code), "error");
                    submitBtn.disabled = false;
                }
            } else {
                // RUN UNIFIED LOG IN PARSING SYSTEM
                const identifier = loginIdentifierField.value.trim();
                if(!identifier) {
                    displayToast("Please input an identity account handle.", "error");
                    submitBtn.disabled = false;
                    return;
                }

                let resolvedEmail = identifier;

                try {
                    // If the user did not supply a standard '@' construct, search our mapping index
                    if (!identifier.includes('@')) {
                        const lookupTerm = identifier.toLowerCase();
                        const usersRef = collection(db, "users");
                        
                        // Check profile username paths
                        let matchQuery = query(usersRef, where("username", "==", lookupTerm));
                        let snapshot = await getDocs(matchQuery);
                        
                        // Fallback check: Profile phone pathways
                        if (snapshot.empty) {
                            matchQuery = query(usersRef, where("phone", "==", lookupTerm));
                            snapshot = await getDocs(matchQuery);
                        }

                        if (!snapshot.empty) {
                            resolvedEmail = snapshot.docs[0].data().email;
                        } else {
                            throw { code: 'auth/user-not-found' };
                        }
                    }

                    await signInWithEmailAndPassword(auth, resolvedEmail, targetPasswordValue);
                    displayToast("Identity verified. Access granted.", "success");
                    redirectUserToDashboard();
                } catch (error) {
                    displayToast(parseFirebaseErrorMessage(error.code), "error");
                    submitBtn.disabled = false;
                }
            }
        });

        googleBtn.addEventListener('click', async () => {
            clearToast();
            try {
                const outcome = await signInWithPopup(auth, googleProvider);
                
                // Sync baseline profile layout maps if Google is a fresh instance tracking route
                await setDoc(doc(db, "users", outcome.user.uid), {
                    uid: outcome.user.uid,
                    email: outcome.user.email,
                    username: outcome.user.email.split('@')[0],
                    phone: "Google Linked Account",
                    displayName: outcome.user.displayName
                }, { merge: true });

                displayToast("Google synchronization complete. Access granted.", "success");
                redirectUserToDashboard();
            } catch (error) {
                if (error.code !== "auth/popup-closed-by-user") {
                    displayToast(parseFirebaseErrorMessage(error.code), "error");
                }
            }
        });

        function displayToast(msg, variant) {
            statusToast.textContent = msg;
            statusToast.className = `status-toast ${variant}`;
            statusToast.style.display = "block";
        }

        function clearToast() {
            statusToast.style.display = "none";
        }

        function redirectUserToDashboard() {
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }

        function parseFirebaseErrorMessage(systemErrorCode) {
            switch(systemErrorCode) {
                case 'custom/username-taken': return "This username is already taken by another creator.";
                case 'auth/email-already-in-use': return "This email is already associated with an account.";
                case 'auth/invalid-email': return "The submitted email format parameters are invalid.";
                case 'auth/weak-password': return "Password tracking error: Must be at least 6 characters.";
                case 'auth/user-not-found': return "No user profile matches those parameters.";
                case 'auth/wrong-password': return "Incorrect security credential parameters.";
                case 'auth/invalid-credential': return "Authentication mismatch. Double check your login inputs.";
                default: return `System Notice: ${systemErrorCode.replace('auth/', '').replace(/-/g, ' ')}`;
            }
        }
    </script>
</body>
</html>
