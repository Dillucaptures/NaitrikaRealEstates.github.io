<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillu Captures | Secure Portal</title>
    <style>
        :root {
            --glass-bg: rgba(0, 0, 0, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --instagram-blue: #0095f6;
            --instagram-blue-hover: #1877f2;
            --system-success: #30d158;
            --system-error: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HIGH FI PHOTOGRAPHY FOCUS SONY CAMERA BACKGROUND SCENE --- */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 385px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .liquid-glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
        }

        .brand-logo {
            font-size: 1.8rem;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* --- METHOD SEGMENT NAVIGATION TOGGLES --- */
        .auth-method-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .method-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .method-tab.active {
            color: var(--text-primary);
            border-bottom: 2px solid var(--text-primary);
        }

        .input-group {
            margin-bottom: 10px;
            position: relative;
        }

        .glass-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.8);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .action-button {
            width: 100%;
            padding: 12px;
            background: var(--instagram-blue);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .action-button:hover { background-color: var(--instagram-blue-hover); }
        .action-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .or-divider::before, .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }
        .or-divider::before { margin-right: 14px; }
        .or-divider::after { margin-left: 14px; }

        .social-buttons-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .social-auth-trigger {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .social-auth-trigger:hover { background: rgba(255, 255, 255, 0.12); }
        .social-auth-trigger svg { width: 16px; height: 16px; fill: currentColor; }

        .status-toast {
            font-size: 12px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            line-height: 16px;
            text-align: left;
        }
        .status-toast.error { background: rgba(255, 59, 48, 0.15); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.25); }
        .status-toast.success { background: rgba(48, 209, 88, 0.15); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.25); }

        .toggle-view-card {
            padding: 20px;
            font-size: 14px;
            color: var(--text-primary);
        }
        .toggle-view-card a {
            color: var(--instagram-blue);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }
        .toggle-view-card a:hover { text-decoration: underline; }

        /* Dynamic Visibility Viewports Layouts Switchers */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        #otpVerificationSubblock { display: none; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; }
    </style>
</head>
<body>

    <!-- RECAPTCHA ANCHOR LINK REQUIREMENT OBJECT -->
    <div id="recaptcha-container"></div>

    <div class="auth-container">
        <div class="liquid-glass-card">
            <div class="brand-logo">DILLU CAPTURES</div>
            
            <!-- ROUTE CONFIGURATION NAVIGATION VIEWS -->
            <div class="auth-method-tabs" id="authMethodTabsHeader">
                <button type="button" class="method-tab active" id="tabPassword">Credentials</button>
                <button type="button" class="method-tab" id="tabPhoneOtp">Mobile OTP</button>
            </div>

            <form id="authForm">
                
                <!-- 1. PASSWORD ACCESS METHOD BLOCK (Handles Username, Email, and Phone matching strings) -->
                <div id="passwordViewSection" class="view-section active">
                    <div class="input-group login-only">
                        <input type="text" id="loginIdentifierField" class="glass-input" placeholder="Phone number, username, or email">
                    </div>
                    <div class="input-group signup-only" style="display:none;">
                        <input type="email" id="signupEmailField" class="glass-input" placeholder="Email address">
                    </div>
                    <div class="input-group signup-only" style="display:none;">
                        <input type="text" id="signupNameField" class="glass-input" placeholder="Full Name">
                    </div>
                    <div class="input-group signup-only" style="display:none;">
                        <input type="text" id="signupUsernameField" class="glass-input" placeholder="Username">
                    </div>
                    <div class="input-group signup-only" style="display:none;">
                        <input type="text" id="signupPhoneField" class="glass-input" placeholder="Mobile Number (with country code e.g. +91...)">
                    </div>
                    <div class="input-group">
                        <input type="password" id="passwordField" class="glass-input" placeholder="Password">
                    </div>
                    <button type="submit" id="passwordSubmitBtn" class="action-button">Log In</button>
                </div>

                <!-- 2. NATIVE PHONE NUMBER OTP AUTH VIEWS CONTAINER -->
                <div id="phoneOtpViewSection" class="view-section">
                    <div class="input-group">
                        <input type="text" id="otpMobilePhoneField" class="glass-input" placeholder="Mobile phone (e.g. +919876543210)">
                    </div>
                    <button type="button" id="sendOtpRequestBtn" class="action-button">Send Verification SMS</button>

                    <!-- Hidden Verification Sub-matrix Field -->
                    <div id="otpVerificationSubblock">
                        <div class="input-group">
                            <input type="text" id="otpVerificationCodeField" class="glass-input" placeholder="6-digit confirmation code" maxlength="6">
                        </div>
                        <button type="button" id="verifyOtpCodeBtn" class="action-button" style="background-color: var(--system-success);">Confirm & Verify</button>
                    </div>
                </div>

            </form>

            <div class="or-divider">or</div>

            <!-- GOOGLE SSO GATEWAY ENTRY POINT -->
            <div class="social-buttons-stack">
                <button type="button" class="social-auth-trigger" id="googleAuthButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.997 0-.746-.08-1.32-.176-1.898H12.24z"/>
                    </svg>
                    Continue with Gmail / Google
                </button>
            </div>

            <div id="statusToast" class="status-toast"></div>
        </div>

        <div class="liquid-glass-card toggle-view-card" id="formRegistrationContextToggleRow">
            <span id="toggleTextLabel">Don't have an account?<a href="#" id="switchRegistrationActionLink">Sign up</a></span>
        </div>
    </div>

    <!-- SCRIPT DEPLOYMENT MATRIX ENGINE SYSTEMS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            updateProfile,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDocs, 
            collection, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Verified Master Tracking Configuration Settings
        const firebaseConfig = {
            apiKey: "AIzaSyATrPSHyg8SS6BzafsoFYI71g2-vAbMYjU",
            authDomain: "dillucaptures07.firebaseapp.com",
            projectId: "dillucaptures07",
            storageBucket: "dillucaptures07.firebasestorage.app",
            messagingSenderId: "331192229836",
            appId: "1:331192229836:web:dbde836b8e043558038769",
            measurementId: "G-R0ES0XEHSV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Screen Element Mappings
        const authForm = document.getElementById('authForm');
        const passwordInput = document.getElementById('passwordField');
        const passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
        const googleBtn = document.getElementById('googleAuthButton');
        const statusToast = document.getElementById('statusToast');
        
        // Form Input Fields
        const loginIdentifierField = document.getElementById('loginIdentifierField');
        const signupEmailField = document.getElementById('signupEmailField');
        const signupNameField = document.getElementById('signupNameField');
        const signupUsernameField = document.getElementById('signupUsernameField');
        const signupPhoneField = document.getElementById('signupPhoneField');
        
        // Navigation View Elements Handles
        const tabPassword = document.getElementById('tabPassword');
        const tabPhoneOtp = document.getElementById('tabPhoneOtp');
        const passwordViewSection = document.getElementById('passwordViewSection');
        const phoneOtpViewSection = document.getElementById('phoneOtpViewSection');
        const switchRegistrationActionLink = document.getElementById('switchRegistrationActionLink');
        const toggleTextLabel = document.getElementById('toggleTextLabel');
        const authMethodTabsHeader = document.getElementById('authMethodTabsHeader');

        // Phone OTP Specific Framework Controls Nodes
        const otpMobilePhoneField = document.getElementById('otpMobilePhoneField');
        const sendOtpRequestBtn = document.getElementById('sendOtpRequestBtn');
        const otpVerificationSubblock = document.getElementById('otpVerificationSubblock');
        const otpVerificationCodeField = document.getElementById('otpVerificationCodeField');
        const verifyOtpCodeBtn = document.getElementById('verifyOtpCodeBtn');

        let applicationIsSignUpState = false;
        let activeAuthenticationConfirmationResult = null;

        // --- NAVIGATION INTERACTION HANDLERS ---
        tabPassword.addEventListener('click', () => {
            tabPassword.classList.add('active');
            tabPhoneOtp.classList.remove('active');
            passwordViewSection.classList.add('active');
            phoneOtpViewSection.classList.remove('active');
            clearToast();
        });

        tabPhoneOtp.addEventListener('click', () => {
            if(applicationIsSignUpState) {
                toggleRegistrationViewsState(); // Revert to sign-in configuration layout context lines
            }
            tabPhoneOtp.classList.add('active');
            tabPassword.classList.remove('active');
            phoneOtpViewSection.classList.add('active');
            passwordViewSection.classList.remove('active');
            clearToast();
        });

        switchRegistrationActionLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleRegistrationViewsState();
        });

        function toggleRegistrationViewsState() {
            applicationIsSignUpState = !applicationIsSignUpState;
            clearToast();
            
            const signupInputs = document.querySelectorAll('.signup-only');
            const loginInputs = document.querySelectorAll('.login-only');

            if(applicationIsSignUpState) {
                signupInputs.forEach(el => el.style.display = 'block');
                loginInputs.forEach(el => el.style.display = 'none');
                passwordSubmitBtn.textContent = "Sign Up";
                toggleTextLabel.innerHTML = `Have an account?<a href="#" id='switchRegistrationActionLink'>Log in</a>`;
                authMethodTabsHeader.style.display = 'none'; // Lock navigation during setup pipelines
            } else {
                signupInputs.forEach(el => el.style.display = 'none');
                loginInputs.forEach(el => el.style.display = 'block');
                passwordSubmitBtn.textContent = "Log In";
                toggleTextLabel.innerHTML = `Don't have an account?<a href="#" id='switchRegistrationActionLink'>Sign up</a>`;
                authMethodTabsHeader.style.display = 'flex';
            }
            
            // Re-bind target handler memory maps cleanly
            document.getElementById('switchRegistrationActionLink').addEventListener('click', (e) => {
                e.preventDefault();
                toggleRegistrationViewsState();
            });
        }

        // --- INITIALIZE SECURITY CAPTCHA VALIDATOR ROUTINE FLOATING LOOP ---
        function initializeInvisibleRecaptchaVerifier() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible',
                    'callback': (response) => { /* Captures successful handshake resolution */ }
                });
            }
        }

        // --- MOBILE PHONE NUMBER SMS REQUEST TRANSMISSION ROUTE ---
        sendOtpRequestBtn.addEventListener('click', async () => {
            clearToast();
            const rawPhoneNumberString = otpMobilePhoneField.value.trim();
            
            if (!rawPhoneNumberString || !rawPhoneNumberString.startsWith('+')) {
                displayToast("A valid country code structural phone format is required (e.g. +919876543210).", "error");
                return;
            }

            sendOtpRequestBtn.disabled = true;
            displayToast("Processing captcha handshake vectors...", "success");

            try {
                initializeInvisibleRecaptchaVerifier();
                const confirmation = await signInWithPhoneNumber(auth, rawPhoneNumberString, window.recaptchaVerifier);
                activeAuthenticationConfirmationResult = confirmation;
                
                displayToast("SMS transit verification package transmitted safely.", "success");
                otpVerificationSubblock.style.display = 'block';
            } catch (err) {
                console.error(err);
                displayToast(parseFirebaseErrorMessage(err.code || err.message), "error");
                sendOtpRequestBtn.disabled = false;
                if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(id => grecaptcha.reset(id));
            }
        });

        // --- OTP DIGITS CODE VERIFICATION RESOLUTION ---
        verifyOtpCodeBtn.addEventListener('click', async () => {
            clearToast();
            const explicitVerificationCode = otpVerificationCodeField.value.trim();

            if(explicitVerificationCode.length !== 6) {
                displayToast("Invalid OTP layout construct. Code must sequence exactly 6 digits.", "error");
                return;
            }

            verifyOtpCodeBtn.disabled = true;

            try {
                const userCredential = await activeAuthenticationConfirmationResult.confirm(explicitVerificationCode);
                
                // Sync reference index routing patterns into database to capture fallback handles
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    uid: userCredential.user.uid,
                    email: userCredential.user.email || `${userCredential.user.phoneNumber}@mobile-login.com`,
                    username: userCredential.user.phoneNumber,
                    phone: userCredential.user.phoneNumber,
                    displayName: userCredential.user.phoneNumber
                }, { merge: true });

                displayToast("Handshake resolution matches. Access token generated.", "success");
                redirectUserToDashboard();
            } catch (err) {
                displayToast("Invalid confirmation digits pattern submitted. Verify sequence.", "error");
                verifyOtpCodeBtn.disabled = false;
            }
        });

        // --- UNIFIED EMAIL/USERNAME/PHONE ROUTING PASSWORD LOGIC CONTROLLER ---
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearToast();
            
            // Bypass processing block if navigation window is targeted to SMS OTP views channel 
            if(tabPhoneOtp.classList.contains('active')) return;

            const trackingPasswordSecretValue = passwordInput.value;
            if(!trackingPasswordSecretValue) {
                displayToast("Security credential verification token password parameter is missing.", "error");
                return;
            }

            passwordSubmitBtn.disabled = true;

            if (applicationIsSignUpState) {
                const email = signupEmailField.value.trim();
                const name = signupNameField.value.trim();
                const username = signupUsernameField.value.trim().toLowerCase();
                const phone = signupPhoneField.value.trim();

                if(!email || !username || !phone) {
                    displayToast("All dynamic metadata elements are requested to establish profile registry entries.", "error");
                    passwordSubmitBtn.disabled = false;
                    return;
                }

                try {
                    const userRef = collection(db, "users");
                    const checkConflictUsernameSnapshot = await getDocs(query(userRef, where("username", "==", username)));
                    if (!checkConflictUsernameSnapshot.empty) throw { code: 'custom/username-taken' };

                    const credentialsReceipt = await createUserWithEmailAndPassword(auth, email, trackingPasswordSecretValue);
                    await updateProfile(credentialsReceipt.user, { displayName: name || username });
                    
                    await setDoc(doc(db, "users", credentialsReceipt.user.uid), {
                        uid: credentialsReceipt.user.uid,
                        email: email,
                        username: username,
                        phone: phone,
                        displayName: name
                    });

                    displayToast("Account initialized cleanly. Routing workspace viewports...", "success");
                    redirectUserToDashboard();
                } catch (err) {
                    displayToast(parseFirebaseErrorMessage(err.code), "error");
                    passwordSubmitBtn.disabled = false;
                }
            } else {
                const inputIdentifierValue = loginIdentifierField.value.trim();
                if(!inputIdentifierValue) {
                    displayToast("Please provide an authentication target identity value string.", "error");
                    passwordSubmitBtn.disabled = false;
                    return;
                }

                let resolvedRoutingEmailAddressValue = inputIdentifierValue;

                try {
                    if (!inputIdentifierValue.includes('@')) {
                        const parsingSearchQueryMatchTerm = inputIdentifierValue.toLowerCase();
                        const usersRef = collection(db, "users");
                        
                        let targetMappingCrossCheckQuery = query(usersRef, where("username", "==", parsingSearchQueryMatchTerm));
                        let resultingSnapshotDocs = await getDocs(targetMappingCrossCheckQuery);
                        
                        if (resultingSnapshotDocs.empty) {
                            targetMappingCrossCheckQuery = query(usersRef, where("phone", "==", parsingSearchQueryMatchTerm));
                            resultingSnapshotDocs = await getDocs(targetMappingCrossCheckQuery);
                        }

                        if (!resultingSnapshotDocs.empty) {
                            resolvedRoutingEmailAddressValue = resultingSnapshotDocs.docs[0].data().email;
                        } else {
                            throw { code: 'auth/user-not-found' };
                        }
                    }

                    await signInWithEmailAndPassword(auth, resolvedRoutingEmailAddressValue, trackingPasswordSecretValue);
                    displayToast("Identity validated. Constructing secure interface stream.", "success");
                    redirectUserToDashboard();
                } catch (err) {
                    displayToast(parseFirebaseErrorMessage(err.code), "error");
                    passwordSubmitBtn.disabled = false;
                }
            }
        });

        // --- GOOGLE SIGN IN FEDERATED MULTI IDENTITY FLOW ---
        googleBtn.addEventListener('click', async () => {
            clearToast();
            try {
                const outcome = await signInWithPopup(auth, googleProvider);
                
                await setDoc(doc(db, "users", outcome.user.uid), {
                    uid: outcome.user.uid,
                    email: outcome.user.email,
                    username: outcome.user.email.split('@')[0],
                    phone: outcome.user.phoneNumber || "Google Connected Instance Link",
                    displayName: outcome.user.displayName
                }, { merge: true });

                displayToast("Google profile context maps matched. Access granted.", "success");
                redirectUserToDashboard();
            } catch (err) {
                if (err.code !== "auth/popup-closed-by-user") {
                    displayToast(parseFirebaseErrorMessage(err.code), "error");
                }
            }
        });

        // --- STATUS TOAST AND REDIRECT SYSTEM PIPELINES ---
        function displayToast(msg, variant) {
            statusToast.textContent = msg;
            statusToast.className = `status-toast ${variant}`;
            statusToast.style.display = "block";
        }

        function clearToast() {
            statusToast.style.display = "none";
        }

        function redirectUserToDashboard() {
            setTimeout(() => { window.location.href = "index.html"; }, 1200);
        }

        function parseFirebaseErrorMessage(systemErrorCode) {
            switch(systemErrorCode) {
                case 'custom/username-taken': return "Registration error: This unique user identity handle is already registered.";
                case 'auth/email-already-in-use': return "Registration error: This email coordinates match an existing user record.";
                case 'auth/invalid-email': return "Validation check error: Please double-check formatting layout elements.";
                case 'auth/weak-password': return "Security validation rule exception: Password must measure at least 6 characters.";
                case 'auth/user-not-found': return "Identity check mismatch: No registered parameters align with that identifier entry.";
                case 'auth/wrong-password': return "Validation failed: Security access verification code does not match.";
                case 'auth/invalid-credential': return "Identity resolution conflict: Confirm accurate login identifier parameters strings.";
                case 'auth/unauthorized-domain': return "Firebase security policy block: This domain location route needs to be whitelisted inside your Firebase Authentication settings tab dashboard.";
                default: return `Notice string caught: ${systemErrorCode.replace('auth/', '').replace(/-/g, ' ')}`;
            }
        }
    </script>
</body>
</html>
