<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillu Captures | Login</title>
    <style>
        :root {
            --bg-card: rgba(0, 0, 0, 0.78);
            --border-color: #262626;
            --text-primary: #ffffff;
            --text-secondary: #a8a8a8;
            --ig-blue: #0095f6;
            --ig-blue-hover: #1877f2;
            --system-error: #ed4956;
            --system-success: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SONY CAMERA BACKGROUND LAYER --- */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- INSTAGRAM COMPACT DARK UI BOX --- */
        .auth-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .brand-heading {
            font-size: 1.75rem;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .form-input-container {
            margin-bottom: 6px;
            position: relative;
        }

        .ig-field {
            width: 100%;
            padding: 10px 12px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }

        .ig-field:focus {
            border-color: #a8a8a8;
        }

        .ig-field::placeholder {
            color: #737373;
        }

        .submit-action-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--ig-blue);
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.1s ease;
        }

        .submit-action-btn:hover {
            background-color: var(--ig-blue-hover);
        }

        .submit-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .divider-row {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider-row::before, .divider-row::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .divider-row::before { margin-right: 18px; }
        .divider-row::after { margin-left: 18px; }

        .google-login-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .google-login-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .toast-notification {
            font-size: 13px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            line-height: 16px;
            text-align: center;
        }
        .toast-notification.error { background: rgba(237, 73, 86, 0.15); color: var(--system-error); border: 1px solid rgba(237, 73, 86, 0.25); }
        .toast-notification.success { background: rgba(48, 209, 88, 0.15); color: var(--system-success); border: 1px solid rgba(48, 209, 88, 0.25); }

        .switch-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            font-size: 14px;
            color: var(--text-primary);
            text-align: center;
        }
        .switch-box a {
            color: var(--ig-blue);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }
        .switch-box a:hover { text-decoration: underline; }

        /* Dynamic Visibility Viewports Mapping */
        .signup-only-field { display: none; }
        body.display-signup .signup-only-field { display: block; }
        body.display-signup .login-only-field { display: none; }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <!-- PRIMARY SUBMISSION CONTAINER CORE -->
        <div class="auth-box">
            <div class="brand-heading">Dillu Captures</div>
            
            <form id="identityFormActionGateway">
                
                <!-- UNIFIED INPUT MATRIX FIELD (Resolves Username, Email, or Phone inputs) -->
                <div class="form-input-container login-only-field">
                    <input type="text" id="unifiedLoginUserField" class="ig-field" placeholder="Phone number, username, or email">
                </div>

                <!-- SIGNUP EXPLICIT ENTRY SPLIT NODES -->
                <div class="form-input-container signup-only-field">
                    <input type="email" id="registrationEmailField" class="ig-field" placeholder="Email address">
                </div>
                <div class="form-input-container signup-only-field">
                    <input type="text" id="registrationFullNameField" class="ig-field" placeholder="Full Name">
                </div>
                <div class="form-input-container signup-only-field">
                    <input type="text" id="registrationUsernameField" class="ig-field" placeholder="Username">
                </div>
                <div class="form-input-container signup-only-field">
                    <input type="text" id="registrationPhoneField" class="ig-field" placeholder="Mobile Number">
                </div>

                <!-- PASS SECURED ACCESS CAPTURE CODE WORD -->
                <div class="form-input-container">
                    <input type="password" id="secureCredentialPasswordField" class="ig-field" placeholder="Password" required>
                </div>

                <button type="submit" id="primarySubmitButtonHandle" class="submit-action-btn">Log In</button>
            </form>

            <div class="divider-row">or</div>

            <!-- FEDERATED GMAIL SIGN IN ENTRY NODE -->
            <button type="button" class="google-login-btn" id="triggerGoogleAuthButton">
                <svg viewBox="0 0 24 24">
                    <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.997 0-.746-.08-1.32-.176-1.898H12.24z"/>
                </svg>
                Log in with Google / Gmail
            </button>

            <div id="alertToastBox" class="toast-notification"></div>
        </div>

        <!-- FOOTER TOGGLE PANEL VIEWPORTS CONTROLLER LINKS -->
        <div class="switch-box">
            <span id="toggleTextRow">Don't have an account?<a href="#" id="toggleActionLinkViewport">Sign up</a></span>
        </div>
    </div>

    <!-- MODULE SERVICE WORKER CLIENT INJECTIONS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDocs, 
            collection, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Maintained Original Keys Context Architecture Tracking Formats
        const firebaseConfig = {
            apiKey: "AIzaSyATrPSHyg8SS6BzafsoFYI71g2-vAbMYjU",
            authDomain: "dillucaptures07.firebaseapp.com",
            projectId: "dillucaptures07",
            storageBucket: "dillucaptures07.firebasestorage.app",
            messagingSenderId: "331192229836",
            appId: "1:331192229836:web:dbde836b8e043558038769",
            measurementId: "G-R0ES0XEHSV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Screen Element Cache Map Allocations
        const body = document.body;
        const identityFormActionGateway = document.getElementById('identityFormActionGateway');
        const secureCredentialPasswordField = document.getElementById('secureCredentialPasswordField');
        const primarySubmitButtonHandle = document.getElementById('primarySubmitButtonHandle');
        const triggerGoogleAuthButton = document.getElementById('triggerGoogleAuthButton');
        const alertToastBox = document.getElementById('alertToastBox');
        
        // Input Element Assignments Handles
        const unifiedLoginUserField = document.getElementById('unifiedLoginUserField');
        const registrationEmailField = document.getElementById('registrationEmailField');
        const registrationFullNameField = document.getElementById('registrationFullNameField');
        const registrationUsernameField = document.getElementById('registrationUsernameField');
        const registrationPhoneField = document.getElementById('registrationPhoneField');
        const toggleActionLinkViewport = document.getElementById('toggleActionLinkViewport');
        const toggleTextRow = document.getElementById('toggleTextRow');

        let runtimeViewIsSignUpContext = false;

        // --- MANIPULATE SPA VIEW RECONFIGURATIONS INTERFACE MAPS ---
        toggleActionLinkViewport.addEventListener('click', (e) => {
            e.preventDefault();
            runtimeViewIsSignUpContext = !runtimeViewIsSignUpContext;
            clearNotificationToast();

            if (runtimeViewIsSignUpContext) {
                body.classList.add('display-signup');
                primarySubmitButtonHandle.textContent = "Sign Up";
                toggleTextRow.innerHTML = `Have an account?<a href="#" id="toggleActionLinkViewport">Log in</a>`;
            } else {
                body.classList.remove('display-signup');
                primarySubmitButtonHandle.textContent = "Log In";
                toggleTextRow.innerHTML = `Don't have an account?<a href="#" id="toggleActionLinkViewport">Sign up</a>`;
            }

            // Re-bind target action tracking references onto dynamically drawn inner HTML layout streams
            document.getElementById('toggleActionLinkViewport').addEventListener('click', (e) => {
                e.preventDefault();
                toggleActionLinkViewport.click();
            });
        });

        // --- SUBMISSION CONTROLLER INTERCEPT HANDLERS ---
        identityFormActionGateway.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearNotificationToast();
            primarySubmitButtonHandle.disabled = true;

            const targetInputSecretValue = secureCredentialPasswordField.value;

            if (runtimeViewIsSignUpContext) {
                // --- SIGN UP ROUTINE PIPELINES ---
                const email = registrationEmailField.value.trim();
                const fullName = registrationFullNameField.value.trim();
                const username = registrationUsernameField.value.trim().toLowerCase();
                const phone = registrationPhoneField.value.trim();

                if (!email || !username || !phone) {
                    renderNotificationToast("All registration metadata elements are required to construct profiles.", "error");
                    primarySubmitButtonHandle.disabled = false;
                    return;
                }

                try {
                    // Pre-flight parsing verification check to confirm unique handles availability loops
                    const usersRef = collection(db, "users");
                    const userCheckSnapshot = await getDocs(query(usersRef, where("username", "==", username)));
                    if (!userCheckSnapshot.empty) throw { code: 'custom/username-taken' };

                    const registrationReceipt = await createUserWithEmailAndPassword(auth, email, targetInputSecretValue);
                    await updateProfile(registrationReceipt.user, { displayName: fullName || username });
                    
                    // Generate searchable entity references mapping table maps inside Firestore
                    await setDoc(doc(db, "users", registrationReceipt.user.uid), {
                        uid: registrationReceipt.user.uid,
                        email: email,
                        username: username,
                        phone: phone,
                        displayName: fullName
                    });

                    renderNotificationToast("Account verification mapping created successfully. Initializing stream...", "success");
                    executeSecureNavigationRouting();
                } catch (err) {
                    renderNotificationToast(translateFirebaseErrorCodeMessage(err.code || err.message), "error");
                    primarySubmitButtonHandle.disabled = false;
                }

            } else {
                // --- RE-ROUTED LOG IN PARSING SYSTEM (Zero reCAPTCHA footprint) ---
                const rawIdentifierValue = unifiedLoginUserField.value.trim();
                if (!rawIdentifierValue) {
                    renderNotificationToast("Provide your username, registration email, or mobile coordinate handle.", "error");
                    primarySubmitButtonHandle.disabled = false;
                    return;
                }

                let executionTargetRouteEmail = rawIdentifierValue;

                try {
                    // Check if entry string maps an explicit domain schema construct natively
                    if (!rawIdentifierValue.includes('@')) {
                        const sanitizedSearchQueryValue = rawIdentifierValue.toLowerCase();
                        const lookupRef = collection(db, "users");

                        // Execute parsing search check against username rows
                        let crossCheckQueryInstance = query(lookupRef, where("username", "==", sanitizedSearchQueryValue));
                        let searchReceiptSnapshot = await getDocs(crossCheckQueryInstance);

                        // Fallback check processing phone string sequences
                        if (searchReceiptSnapshot.empty) {
                            crossCheckQueryInstance = query(lookupRef, where("phone", "==", sanitizedSearchQueryValue));
                            searchReceiptSnapshot = await getDocs(crossCheckQueryInstance);
                        }

                        if (!searchReceiptSnapshot.empty) {
                            executionTargetRouteEmail = searchReceiptSnapshot.docs[0].data().email;
                        } else {
                            throw { code: 'auth/user-not-found' };
                        }
                    }

                    await signInWithEmailAndPassword(auth, executionTargetRouteEmail, targetInputSecretValue);
                    renderNotificationToast("Profile context confirmed. Access authorized.", "success");
                    executeSecureNavigationRouting();
                } catch (err) {
                    renderNotificationToast(translateFirebaseErrorCodeMessage(err.code || err.message), "error");
                    primarySubmitButtonHandle.disabled = false;
                }
            }
        });

        // --- GOOGLE GMAIL SSO COMPONENT ROUTING PIPELINE ---
        triggerGoogleAuthButton.addEventListener('click', async () => {
            clearNotificationToast();
            try {
                const results = await signInWithPopup(auth, googleProvider);
                
                // Keep Firestore index records in sync if logging in via Google for the first time
                await setDoc(doc(db, "users", results.user.uid), {
                    uid: results.user.uid,
                    email: results.user.email,
                    username: results.user.email.split('@')[0],
                    phone: results.user.phoneNumber || "Google Connected Account",
                    displayName: results.user.displayName
                }, { merge: true });

                renderNotificationToast("Google validation handshake resolved safely.", "success");
                executeSecureNavigationRouting();
            } catch (err) {
                // Ignore standard window dismissal interrupts explicitly caught from users closures
                if (err.code !== "auth/popup-closed-by-user") {
                    renderNotificationToast(translateFirebaseErrorCodeMessage(err.code || err.message), "error");
                }
            }
        });

        // --- UTILITY RUNTIME TOAST CONSOLE CHANNELS ---
        function renderNotificationToast(messageTextString, stylisticVariantType) {
            alertToastBox.textContent = messageTextString;
            alertToastBox.className = `toast-notification ${stylisticVariantType}`;
            alertToastBox.style.display = "block";
        }

        function clearNotificationToast() {
            alertToastBox.style.display = "none";
        }

        function executeSecureNavigationRouting() {
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }

        function translateFirebaseErrorCodeMessage(firebaseSystemCode) {
            switch(firebaseSystemCode) {
                case 'custom/username-taken': return "This username is already taken by another creator.";
                case 'auth/email-already-in-use': return "This email coordinates track an existing user record profile.";
                case 'auth/weak-password': return "Security restriction exception: Passwords must measure 6 characters minimum.";
                case 'auth/user-not-found': return "No validation identity parameters align with that user entry profile.";
                case 'auth/wrong-password': return "Incorrect account login credentials validation mismatch.";
                case 'auth/invalid-credential': return "Authentication failure: Verify identity mapping fields data parameters matches.";
                case 'auth/unauthorized-domain': return "Gmail Authorization Block: Whitelist your current browser domain inside your Firebase Console -> Authentication Settings -> Authorized Domains dashboard panel view loop.";
                default: return `System Exception Notice: ${firebaseSystemCode.replace('auth/', '').replace(/-/g, ' ')}`;
            }
        }
    </script>
</body>
</html>
